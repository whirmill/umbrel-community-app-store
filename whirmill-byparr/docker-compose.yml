version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: whirmill-byparr_server_1
      APP_PORT: 8191

  server:
    image: ghcr.io/thephaseless/byparr:3.1.1@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
    restart: on-failure
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8191"
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    stop_grace_period: 30s
