version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: whirmill-limpidog_server_1
      APP_PORT: 4001

  server:
    image: ghcr.io/whirmill/limpidog-crm:2.6.0@sha256:49d00c8b906ed572e9302e2b6a0aaf7cef9123632874692c6d4346449444e921
    container_name: whirmill-limpidog_server_1
    restart: on-failure
    init: true
    user: "1000:1000"
    env_file:
      - path: ${APP_DATA_DIR}/data/limpidog.env
        required: false
    environment:
      DATA_DIR: /data
      UMBREL_APP_SEED: $APP_SEED
      DASHBOARD_ORIGIN: https://dashboard.limpidog.com
      PASSKEY_RP_ID: dashboard.limpidog.com
      PASSKEY_RP_NAME: Limpidog CRM
      CALENDAR_IMPORT_INTERVAL_MINUTES: "1440"
      CALENDAR_IMPORT_LOOKBACK_DAYS: "30"
      CALENDAR_IMPORT_FUTURE_DAYS: "60"
    ports:
      - "5235:4000"
      - "5236:4002"
    networks:
      default:
        # Nginx Proxy Manager forwards the public vhosts to these 1.0.x container names on umbrel_main_network.
        aliases: [whirmill-limpidog_api_1, whirmill-limpidog_dashboard_1, whirmill-limpidog_site_1]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
