manifestVersion: 1
id: whirmill-limpidog
category: files
name: Limpidog
version: "2.18.0"
tagline: Self-hosted operations for Limpidog
description: >-
  Runs Limpidog as one Umbrel app: a single server container serves the
  protected operations dashboard (the Umbrel entry point), the API with the
  WhatsApp webhook, and the public site, with its data in two SQLite
  databases under the app data directory. Dedicated API and site ports support
  public virtual hosts through Nginx Proxy Manager. Private integration
  settings stay in data/limpidog.env.
developer: whirmill
website: https://limpidog.com
repo: https://github.com/whirmill/limpidog-crm
support: https://github.com/whirmill/limpidog-crm/issues
port: 5234
path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-limpidog/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Nuova grafica in tutte le sezioni, menu più corto e aperto con il nome e l'icona di LimpiDog Console, costi di Finanza divisi in ricorrenti, ammortamenti e altre spese (contati solo fino a oggi, con confronti sugli stessi giorni), e gli allegati dei clienti su WhatsApp (vocali, foto, video, documenti) inoltrati su Telegram come file.
