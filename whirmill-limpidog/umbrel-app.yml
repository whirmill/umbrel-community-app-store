dependencies: []
releaseNotes: >-
  L'assistente non propone più un orario dentro un appuntamento già in agenda: per ogni tappa del giorno conosce anche l'ora di fine (o la ricava dalla durata) e, prima di suggerire un orario, controlla che sia davvero libero e quanto spazio c'è fino all'appuntamento successivo. Nel bot, /giro mostra ora di inizio e di fine di ogni tappa (per esempio «13:30–17:00»).
