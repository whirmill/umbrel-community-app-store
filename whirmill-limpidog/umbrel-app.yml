releaseNotes: >-
  Su ogni asset puoi aprire un intervento da fare con la spesa prevista o registrare un intervento passato con data approssimativa. I km dei rifornimenti aggiornano tutti i mezzi e la Panoramica conta anche le manutenzioni scadute per ore o km. Il giro del giorno ha l'ordine corretto delle tappe, la verifica prezzi confronta il costo di uscita per zona, l'agente e Telegram (/giro) leggono il giro di oggi, e in Finanza puoi indicare chi ha pagato ogni movimento.
