releaseNotes: >-
  Business plan più realistico: apertura della partita IVA dal 1° gennaio 2027, proiezione a 7 anni con il passaggio del forfettario al 15%, costi del commercialista, INAIL e Camera di Commercio, IVA nel semplificato e regime scelto per ogni scenario. I vocali mandati al bot si possono trascrivere e passare all'agente (da Impostazioni › Funzionalità).
