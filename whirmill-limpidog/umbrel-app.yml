releaseNotes: >-
  Bot Telegram in italiano: i comandi ora si chiamano /conversazioni, /bozze, /incassi, /richiedi, /giro, /stato, /ferma, /nuova, /coda, /recupera, /annulla, /scollega, /menu e /aiuto (i vecchi nomi inglesi funzionano ancora) e il menu dei comandi di ogni chat si aggiorna da solo. /menu apre un menu a pulsanti (Conversazioni, Bozze, Incassi, Richiedi pagamento, Giro di oggi e «Altro» con stato, coda, recupera, nuova chat, aiuto e scollega) che si sfoglia nello stesso messaggio; «Richiedi pagamento» chiede importo, cliente e motivo un passo alla volta.
