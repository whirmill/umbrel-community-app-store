releaseNotes: >-
  Dall'Agenda e dall'Inbox si fissano, spostano, annullano e ripristinano gli appuntamenti con le stesse verifiche del bot, si segnano le indisponibilità (che finiscono sul calendario come «Non disponibile») e c'è «Chiudi richiesta»; l'assistente sa fissare, spostare e annullare appuntamenti, segnare un'indisponibilità e registrare l'esito con l'incasso, sempre con la tua approvazione. Ogni nuova prenotazione di un cliente viene letta solo dai suoi messaggi. Le nuove funzioni su Telegram (🗓 Fissa, 🔁 Sposta, ❌ Annulla dalla scheda), il riepilogo serale e il riconoscimento con il modello restano spenti in Impostazioni › Funzionalità finché non decidi di accenderli; il comando per passare al nuovo calendario è pronto.
