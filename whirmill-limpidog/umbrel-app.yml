manifestVersion: 1
id: whirmill-limpidog
category: files
name: Limpidog
version: "2.2.0"
tagline: Self-hosted operations for Limpidog
description: >-
  Runs Limpidog as one Umbrel app: a single server container serves the
  protected operations dashboard (the Umbrel entry point), the API with the
  WhatsApp webhook, and the public site, with its data in two SQLite
  databases under the app data directory. Dedicated API and site ports support
  public virtual hosts through Nginx Proxy Manager. Private integration
  settings stay in data/limpidog.env.
developer: whirmill
website: https://limpidog.com
repo: https://github.com/whirmill/limpidog-crm
support: https://github.com/whirmill/limpidog-crm/issues
port: 5234
path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-limpidog/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Nuova pagina WhatsApp in Impostazioni (solo admin) per collegare il numero di WhatsApp Business in coesistenza tramite Embedded Signup di Meta: il telefono continua a funzionare come prima, i messaggi arrivano al server e il bot Telegram puo' rispondere tramite la Cloud API. Al collegamento il token viene salvato nel file whatsapp.key della cartella dati e l'invio si attiva senza riavvio; contatti e cronologia delle chat vengono sincronizzati entro 24 ore, con avanzamento visibile nella pagina. Servono prima i passi Meta del proprietario (Tech Provider, App Review, configurazione di Facebook Login for Business in META_LOGIN_CONFIG_ID e WHATSAPP_APP_SECRET nell'ambiente dell'app).
