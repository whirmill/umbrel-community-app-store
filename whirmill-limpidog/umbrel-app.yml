releaseNotes: >-
  Il nuovo business plan: scenari e leve con la fonte di ogni numero, i prossimi 12 mesi e 3 anni, il guadagno orario di Pamela, il listino proposto da applicare con conferma, le opzioni per il rientro del prestito e il confronto tra forfettario, semplificato e associazione. Il piano di giugno resta come archivio.
