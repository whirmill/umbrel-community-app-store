releaseNotes: >-
  Gli asset hanno costo d'acquisto e ammortamento mensile, i costi ricorrenti come assicurazione e bollo hanno lo storico degli importi e le manutenzioni una spesa prevista. Il profitto è diviso fra competenza e cassa, con gli stessi numeri in Finanza, Panoramica, Andamento, agente e Telegram. Nuovo regime fiscale con storico in Impostazioni: tasse, contributi e profitto netto stimati ovunque, simulazione «Se fossi in forfettario» e una pagina Scenari fiscali per confrontare Nessuno, Forfettario e Associazione con i costi «E se…».
