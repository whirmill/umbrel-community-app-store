manifestVersion: 1
id: whirmill-limpidog
category: files
name: Limpidog
version: "1.0.3"
tagline: Self-hosted operations for Limpidog
description: >-
  Runs the Limpidog API, operations dashboard, public-site service, background
  worker, and PostgreSQL database as one Umbrel app. The Umbrel entry point is
  the protected operations dashboard; dedicated API and site ports support
  public virtual hosts through Nginx Proxy Manager. Background workers ship
  disabled so an existing installation can remain authoritative until its
  final data cutover.
developer: whirmill
website: https://limpidog.com
repo: https://github.com/whirmill/limpidog-crm
support: https://github.com/whirmill/limpidog-crm/issues
port: 5234
path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-limpidog/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Prevents shared Umbrel network aliases from routing Limpidog database and API
  traffic to another app after a host restart.
