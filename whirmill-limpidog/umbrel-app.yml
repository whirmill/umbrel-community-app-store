releaseNotes: >-
  Posizioni degli indirizzi: la piattaforma cerca da sola la posizione di un indirizzo su OpenStreetMap e la applica solo quando è sicura; le altre finiscono in «Da verificare», dove scegli il candidato giusto sulla mappa. In Mappa trovi «Cerca posizione», «Da verificare» e la ricerca di un indirizzo; nel CRM lo stato di ogni indirizzo; su Telegram i comandi /posizione e /posizioni, anche mandando tu la posizione. Un appuntamento con una via nuova crea l'indirizzo, e la posizione mandata da un cliente su WhatsApp diventa un candidato da confermare. La ricerca si accende da Impostazioni › Funzionalità.
