manifestVersion: 1
id: whirmill-limpidog
category: files
name: Limpidog
version: "2.25.0"
tagline: Self-hosted operations for Limpidog
description: >-
  Runs Limpidog as one Umbrel app: a single server container serves the
  protected operations dashboard (the Umbrel entry point), the API with the
  WhatsApp webhook, and the public site, with its data in two SQLite
  databases under the app data directory. Dedicated API and site ports support
  public virtual hosts through Nginx Proxy Manager. Private integration
  settings stay in data/limpidog.env.
developer: whirmill
website: https://limpidog.com
repo: https://github.com/whirmill/limpidog-crm
support: https://github.com/whirmill/limpidog-crm/issues
