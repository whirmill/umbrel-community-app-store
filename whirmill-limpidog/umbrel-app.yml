manifestVersion: 1
id: whirmill-limpidog
category: files
name: Limpidog
version: "2.1.0"
tagline: Self-hosted operations for Limpidog
description: >-
  Runs Limpidog as one Umbrel app: a single server container serves the
  protected operations dashboard (the Umbrel entry point), the API with the
  WhatsApp webhook, and the public site, with its data in two SQLite
  databases under the app data directory. Dedicated API and site ports support
  public virtual hosts through Nginx Proxy Manager. Private integration
  settings stay in data/limpidog.env.
developer: whirmill
website: https://limpidog.com
repo: https://github.com/whirmill/limpidog-crm
support: https://github.com/whirmill/limpidog-crm/issues
port: 5234
path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-limpidog/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Arriva il bot Telegram come sidecar di WhatsApp Business: ogni nuovo messaggio WhatsApp diventa una scheda con l'analisi (cane, servizi, zona, durata da tabella, slot proposti), si risponde ai clienti con anteprima e un solo tocco su Invia, si confermano le bozze del calendario e si parla con l'agente, con le notifiche principali. Il collegamento si fa dalla dashboard (Impostazioni, Telegram). L'invio WhatsApp si attiva con le credenziali Meta: token del system user nel file whatsapp.key della cartella dati (permessi 0600) e WHATSAPP_PHONE_NUMBER_ID e WHATSAPP_WABA_ID nell'ambiente dell'app; senza, il bot funziona e rifiuta solo le risposte ai clienti.
