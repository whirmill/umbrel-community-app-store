releaseNotes: >-
  Classifica clienti: ogni annullamento dice se l'ha chiesto il cliente o tu, dopo la visita puoi lasciare un voto con «Com'è andata?», e nel CRM la nuova «Classifica» divide i clienti in Base, Argento e Oro secondo la regolarità, con gli avvisi «Da tenere d'occhio» e «Da non servire» nelle proposte. Nuovi inviti e crediti: puoi segnare chi ha portato chi, e sconti e crediti si applicano all'incasso; per ora tutti gli importi sono a zero, quindi incassi e messaggi restano come prima.
