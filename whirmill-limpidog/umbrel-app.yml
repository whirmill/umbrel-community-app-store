dependencies: []
releaseNotes: >-
  Nuova sezione Soci e finanziamenti con il prestito del titolare, contributi e chi ha pagato ogni spesa; carburante diviso in benzina del generatore e gasolio del furgone, con litri e km anche da Telegram. Nuova pagina Mappa con destinazioni, giro del giorno e costo tra gasolio, tempo e lavoro in base; gli slot usano i minuti di viaggio veri. Piani di manutenzione per ogni componente con ore d'uso stimate, ricambi e date approssimative. Nel Catalogo la verifica prezzi con rendimento orario, prezzi suggeriti e revisione delle durate.
