path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-limpidog/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Obiettivi del mese presi dal business plan, fissati dal 1° del mese e correggibili con una nota; Andamento confronta il reale con il piano e spiega lo scostamento. Da telefono niente più pagine che scorrono di lato né zoom quando tocchi un campo. I vocali dei clienti si possono trascrivere con il pulsante «Trascrivi» su Telegram, o in automatico dalla nuova sezione Funzionalità in Impostazioni.
