manifestVersion: 1
id: whirmill-nostr-vpn
category: networking
name: Nostr VPN Community
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/nostr-vpn/icon.svg
version: "v4.1.6"
tagline: Current admin-approved mesh VPN over Nostr
description: >-
  Nostr VPN turns your Umbrel into a private mesh VPN node for your own devices
  and trusted groups. Approve signed join requests, manage peers, and route
  traffic through trusted exit nodes without relying on a hosted VPN provider
  or a central control server.


  This community package ships the official v4.1.6 server filesystem for both
  amd64 and arm64 so that its protocol and control panel match current desktop
  and mobile clients.
developer: mmalmi and contributors
website: https://github.com/mmalmi/nostr-vpn
repo: https://github.com/mmalmi/nostr-vpn
support: https://github.com/mmalmi/nostr-vpn/issues
dependencies: []
port: 38180
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
torOnly: false
gallery: []
releaseNotes: >-
  Updates the Umbrel server to Nostr VPN v4.1.6 using the verified official
  StartOS release filesystems for amd64 and arm64. The server build inputs are
  unchanged through upstream release commit
  4320001ec84eeec7a32d54419569f63012c81c8d.
submitter: whirmill
submission: https://github.com/whirmill/umbrel-community-app-store
