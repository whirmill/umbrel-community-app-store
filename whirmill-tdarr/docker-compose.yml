version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: whirmill-tdarr_server_1
      APP_PORT: 8265
  server:
    image: >-
      ghcr.io/haveagitgat/tdarr:3.07.00@sha256:ce61af20247825024b790d879ad305411c7e07092e88b4cdf5c686e8dafcf8c0
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      PUID: '1000'
      PGID: '1000'
      UMASK: '002'
      serverIP: 0.0.0.0
      serverPort: '8266'
      webUIPort: '8265'
      internalNode: 'true'
      inContainer: 'true'
      ffmpegVersion: '7'
      nodeName: umbrel-n100-node
      auth: 'false'
      openBrowser: 'false'
      startPaused: 'true'
      transcodegpuWorkers: '1'
      transcodecpuWorkers: '0'
      healthcheckgpuWorkers: '1'
      healthcheckcpuWorkers: '0'
      maxLogSizeMB: '10'
      cronPluginUpdate: ''
    volumes:
      - ${APP_DATA_DIR}/server:/app/server
      - ${APP_DATA_DIR}/configs:/app/configs
      - ${APP_DATA_DIR}/logs:/app/logs
      - ${APP_DATA_DIR}/cache:/temp
      - /home/umbrel/umbrel/home/Downloads/movies:/media/movies
      - /home/umbrel/umbrel/home/Downloads/shows:/media/shows
    devices:
      - /dev/dri:/dev/dri
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    stop_grace_period: 30s
