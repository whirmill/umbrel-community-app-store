manifestVersion: 1
id: whirmill-tdarr
category: media
name: Tdarr
version: "2.87.01-1"
tagline: Distributed media transcoding and library optimization
description: >-
  Tdarr converts and optimizes media libraries with FFmpeg and hardware
  acceleration. This local Umbrel package starts with its internal node paused
  and exposes only the Sonarr/Radarr movie and show libraries.
developer: HaveAGitGat
website: https://tdarr.io
repo: https://github.com/HaveAGitGat/Tdarr
support: https://github.com/HaveAGitGat/Tdarr/issues
port: 8265
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-tdarr/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
permissions:
  - GPU
releaseNotes: >-
  Declare the GPU permission required by current umbrelOS to expose hardware
  acceleration to Tdarr. Keeps Tdarr 2.87.01 and paused worker startup.
