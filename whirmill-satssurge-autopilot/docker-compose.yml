services:
  app_proxy:
    environment:
      APP_HOST: whirmill-satssurge-autopilot_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/whirmill/umbrel-satssurge-autopilot:0.12.2@sha256:6527d289c58110f0544a81bf3b61c647da39a19c3fdf7e706fca7e91909ad897
    container_name: whirmill-satssurge-autopilot_server_1
    restart: on-failure
    init: true
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      SATSSURGE_CONFIG_FILE: /config/satssurge.json
      LND_GRPC_TARGET: ${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}
      LND_TLS_CERT: /lnd/tls.cert
      LND_URL: https://${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_REST_PORT}
      PORT: "8080"
      # Swap S0 (#139): Umbrel's Tor SOCKS proxy (tor_proxy on umbrel_main_network) for the RoboSats public reads;
      # without them swap.observe holds with a reason. Nothing else uses Tor.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/credentials:/credentials:ro
      - ${APP_LIGHTNING_NODE_DATA_DIR}/tls.cert:/lnd/tls.cert:ro
      - ${APP_DATA_DIR}/config:/config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1024m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
