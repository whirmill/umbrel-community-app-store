services:
  app_proxy:
    environment:
      APP_HOST: whirmill-satssurge-autopilot_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/whirmill/umbrel-satssurge-autopilot:0.8.0@sha256:9d5f916ef8196a267fd61f1732428eb0dde0825c6a63b81d7d07c97d20c138c3
    container_name: whirmill-satssurge-autopilot_server_1
    restart: on-failure
    init: true
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      INTERLOCK_FILE: /interlock/status.json
      DIAGNOSTICS_FILE: /diagnostics/status.json
      COMPETITION_FILE: /diagnostics/competition.json
      SATSSURGE_CONFIG_FILE: /config/satssurge.json
      LND_GRPC_TARGET: ${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}
      LND_URL: https://${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_REST_PORT}
      PORT: "8080"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/credentials:/credentials:ro
      - ${APP_DATA_DIR}/interlock:/interlock:ro
      - ${APP_DATA_DIR}/diagnostics:/diagnostics:ro
      - ${APP_DATA_DIR}/config:/config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
