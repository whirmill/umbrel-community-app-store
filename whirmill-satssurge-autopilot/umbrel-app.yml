dependencies: [lightning]
releaseNotes: >-
  0.14.6: Richieste di Approva nelle ore di quiete (#281). Le richieste di Approva con una scadenza (swap-out, Loop Out, depositi e prelievi LN Markets) arrivano ora anche nelle ore di quiete, senza suono, e passano davanti ai messaggi ordinari in coda, così non scadono più senza essere viste; gli altri avvisi operativi e silenziosi aspettano la fine della quiete come prima, e con la quiete spenta non cambia nulla. Se una richiesta scade senza essere mai stata consegnata, il motivo lo dice («richiesta mai consegnata su Telegram (rimasta in coda)») e il messaggio non parte più in ritardo. Un Loop Out in modalità veto parte da solo solo se l'annuncio è stato davvero consegnato; altrimenti non avvia nulla.
