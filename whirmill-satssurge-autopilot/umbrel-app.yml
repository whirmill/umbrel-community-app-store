releaseNotes: >-
  0.14.37: Gli esiti degli esperimenti (esito, bilancio a 7 e 30 giorni, bilancio dell'apertura) su canali già chiusi non arrivano più su Telegram: restano calcolati e visibili nella pagina Esperimenti e per l'assistente. Arrivano sempre quelli negativi, perché sospendono un corridoio o un peer. Il bilancio di una chiusura cooperativa arriva appena la chiusura è confermata, non più 14 giorni dopo; una chiusura forzata aspetta ancora 14 giorni, perché il suo costo on-chain non è definitivo. Sulla copia dei dati di produzione, il 28 novembre i 5 bilanci a 30 giorni su canali chiusi non vengono inviati, e le celle del kernel sono identiche alla 0.14.36. Nessuna impostazione, cella o schema cambia.
