releaseNotes: >-
  0.14.33: correzioni dalla revisione delle chat. Il valutatore non viene più interpellato di continuo sulle stesse aperture e chiusure di canali proposte dal codice: se i dati del candidato non cambiano il suo ultimo verdetto, con data e ora, resta valido per 24 ore (channels.evaluatorRecheckHours), mentre un cambiamento rilevante lo fa rivalutare dopo le solite 6 ore; le richieste risparmiate compaiono nella riga «Valutatore» delle statistiche («richieste evitate»), e la stima è di circa 10–14 richieste al giorno invece di 40. Lo stesso passo di fee scaduto senza risposta (il ribasso notturno di ACINQ) o respinto dal valutatore (il rialzo di LN Markets 664 → 796 ppm) non viene riproposto per 7 giorni (mandate.repeatProposalDays) se i dati non cambiano in modo rilevante. Nuovo elenco channels.frozen, vuoto per impostazione: sui canali elencati il codice non propone modifiche di fee, ribassi, chiusure né canali paralleli. Con le ore di quiete impostate, le proposte del codice che chiedono la tua approvazione aspettano la fine della quiete. Nuovo comando /fee <canale|alias> <ppm> (anche satssurge fee dalla console): prepara subito una proposta di fee per quel canale, senza ricerca e senza modello, con Approva e Rifiuta; passo del proprietario, massimo e dati freschi si controllano come per ogni proposta, e un rifiuto dice il motivo con i limiti. Se Telegram rifiuta la scheda dal vivo di /status, il rifiuto viene ricordato per 7 giorni in questa chat con questo bot (telegram.widgetRefusalDays) e /status risponde subito col testo; un doppio tocco sullo stesso pulsante entro 5 secondi conta come uno solo (telegram.repeatTapSeconds), quindi niente più grafici doppi, mentre Approva, Rifiuta e Segna come fallita tengono le loro protezioni. L'assistente ora vede le ricevute di Loop Out, swap RoboSats e LN Markets (importo, costo, stato, orari e chi ha approvato e quando: alla domanda «erano miei?» risponde il tuo Approva), confronta ogni costo di rebalance solo con il limite della sua stessa decisione, mostra in fee_history il confronto prima/dopo di ogni cambio di fee calcolato dal codice, apre le risposte con una sintesi di circa 1.500 caratteri offrendo i dettagli su richiesta, scrive importi in sat e date come «il 12 novembre», e i messaggi Telegram semplici non superano più i 4.096 caratteri dopo la formattazione. Quattro test legati alla data non scadono più e il test dei vocali non dipende più dai tempi della macchina. Sulla copia dei dati di produzione la configurazione si legge senza errori con le nuove chiavi ai valori predefiniti, aggiornamenti Telegram, coda di uscita e lavori si leggono tutti, le ricevute si mostrano senza fatture, indirizzi o hash, e le 29 celle del kernel sono identiche alla 0.14.32.
