port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Swap-out: chi prende l'ordine viene avvisato in chat quando il pagamento è visto e a ogni conferma; chat letta ogni 20 secondi; la memoria dei prezzi dimentica le prese più vecchie di 30 giorni; riepilogo mensile degli swap nelle statistiche e nel riepilogo giornaliero.
  
  Swap: l'avvio manuale con canale segue l'ordine dei coordinatori del kernel, le ripubblicazioni del libro non contano come prese, un canale aperto con i fondi di uno swap o troppo giovane non fa da sorgente, e una cauzione persa conta contro il coordinatore solo se l'ha causata lui.
  
  Kernel: fee-window e corridor-measure misurati all'ancora dello slot anche se calcolati dopo (niente slot saltati), statistiche delle rotte con la commissione misurata, percentuali per il proprietario con una sola regola (una cifra decimale, troncata).
