dependencies: [lightning]
releaseNotes: >-
  Politica deterministica in osservazione: per ogni canale svuotato, ogni corridoio di rifornimento, ogni canale liquido e per il nodo, il codice calcola ogni 5 minuti cosa farebbe una regola fissa (azione, motivi con i numeri, dati mancanti) e la confronta con ogni decisione automatica del modello e del valutatore. Non cambia nulla nel comportamento: la vedi nelle statistiche, nel rapporto del kernel e chiedendo in chat. Pronto ma spento: l'esecuzione da parte del codice dei passi automatici della scala prezzi (mandate.ladderActuator), e un interruttore del valutatore per ogni classe di decisione; i rebalance restano sempre valutati.
