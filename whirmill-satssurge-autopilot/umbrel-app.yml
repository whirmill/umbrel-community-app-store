manifestVersion: 1
id: whirmill-satssurge-autopilot
category: finance
name: SatsSurge Autopilot
version: "0.5.17"
tagline: An evidence-driven Lightning routing agent
description: >-
  Pi Durable agent for Lightning fee experiments and circular rebalances, using
  a ChatGPT/Codex subscription. Private SQLite accounting, historical evidence,
  durable intent tracking and deterministic budget controls. Protects 500,000
  on-chain sats. Mainnet POC: maximum 30,000 sats cumulative including history,
  1,500 sats daily rebalance costs and 100 sats per attempt. Requires initial
  restricted LND credential provisioning and successful reconciliation. App-control
  evidence remains unknown; financial autonomy stays suspended under the existing
  maintenance claim. Installation does not require host helpers or attestations.
  Paired-owner Telegram conversation with read-only coordination, streaming
  drafts, correction choices, targeted Stop, guarded pause/resume, proposal review,
  accounting notifications and explicit review of recoverable historical requests.
  Web settings retain configuration and read-only history. Native LND collection
  and unified history preserve original records and report coverage gaps;
  their live qualification remains in progress. Agent-generated HTML/DLS exports
  (M4) and optional RoboSats/Amboss/Magma integrations (M5) remain future milestones.
developer: whirmill
website: https://github.com/whirmill/umbrel-community-app-store
