releaseNotes: >-
  0.14.23: #274, ondata D: la valutazione delle decisioni, l'ammissione delle revisioni automatiche, il valutatore e la coda dei lavori leggono i dati in modo tipizzato. Le decisioni salvate (proposta e previsione), gli inoltri e le spese sommati nelle finestre di valutazione, lo stato di ammissione di ogni ambito, l'esito delle revisioni precedenti e le righe dei lavori vengono controllati campo per campo: un importo o un identificativo illeggibile ferma il calcolo con un errore che nomina il record e il campo (mai il valore), prima di scrivere una valutazione, di sospendere una strategia o di ammettere una revisione. La risposta del modello valutatore resta non fidata: un verdetto malformato è ancora una risposta non valida (attesa), come prima, e la stima nel fascicolo usa gli argomenti solo se il mandato li accetterebbe. Con dati validi non cambia niente: stessi importi, stessi verdetti, stessi testi. Contabilità, statistiche e politica in ombra leggono ora dati tipizzati (#274): le righe del registro e le annotazioni del proprietario, i costi dei rebalance, i pagamenti rifiutati, le operazioni dei piani canali, le ricevute dell'ombra della politica, i ladder letti dalla politica deterministica e i record di curva delle fee e del ladder. Con dati validi cifre, testi e celle restano identici al msat. Un record danneggiato o salvato come null ora dà un errore che nomina il campo (e la chiave, mai un id con un hash di pagamento) invece di essere letto come "nessun record" o come "non ancora inviata". Nessuna nuova impostazione e nessun cambio di versione delle celle. Seguiti piccoli della dashboard (#306): i pagamenti fatti dal nodo con un altro wallet o app ora diventano una cella del kernel (external-payments), che la pagina Contabilità mostra con la sua fonte e che il riepilogo Telegram riporta nella riga «Pagamenti esterni a SatsSurge: N, X sat», o con il motivo se la cella manca, senza cifre inventate; la cattura dei pagamenti conserva il nodo di destinazione (l'ultimo salto), così la destinazione è esatta anche quando il canale finale non è nel grafo; il risultato principale di Contabilità sta sempre su una riga propria, anche sugli schermi larghi; i badge senza tono hanno il colore giusto nel tema scuro; a 320 px Panoramica e Attività non escono più dalle schede; l'immagine non contiene più la cartella vuota @playwright. Nessuna nuova impostazione, nessuna modifica allo schema. Swap-out, residui del protocollo RoboSats (#253 S6). Se il pagamento on-chain di uno swap resta senza conferme oltre swap.stuckMinutes (120 min), ti avviso con la stima della fee e le ore rimaste sul timer della chat. Con swap.stuckBump 1 ti propongo anche, con Approva, di spendere il nostro output in modo che paghi pure la transazione bloccata (CPFP), entro swap.bumpMaxSat e il budget mensile degli swap; questo richiede una nuova credenziale separata, swap-bump.macaroon, che permette solo BumpFee. Le ricompense che un coordinatore deve ai nostri robot (metà della cauzione di chi ha preso l'ordine e non l'ha completato, oppure una disputa vinta) vengono controllate e, con Approva, riscosse su una fattura del nostro nodo per l'importo esatto. In una disputa preparo la nostra dichiarazione solo dalle nostre prove (cronologia, transazioni viste dal wallet, numero dei messaggi in chat; mai il testo della controparte) e la invio solo con il tuo Approva. Con swap.newCoordinatorCleanSwaps puoi usare un coordinatore nuovo solo dopo N swap puliti; il valore predefinito 0 lascia tutto com'è oggi. Le statistiche non si bloccano più per due righe del confronto in ombra del 13 novembre in cui il modello non aveva indicato la nuova commissione: quel valore mancante ora si legge come assente, il campionatore non scrive più valori non numerici e, se in futuro una registrazione del confronto risultasse illeggibile, viene saltata e contata nella riga "Confronto in ombra: N registrazioni illeggibili saltate" invece di far fallire statistiche, riepilogo e contesto dell'agente; i conti economici restano rigorosi.
