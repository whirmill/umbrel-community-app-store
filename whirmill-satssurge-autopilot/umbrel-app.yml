releaseNotes: >-
  0.14.29: #271, un deposito su LN Markets parte solo se c'è una strada: prima di chiedere l'Approva l'app cerca con LND una rotta dal canale scelto fino a LN Markets entro la fee massima, e se non ne trova nessuna rifiuta la richiesta subito, senza creare nulla e senza niente da approvare (lnm.requireRoute, di serie 1; con 0 torna il comportamento di prima). Se la stima non si può fare, per esempio per un errore di LND, l'Approva arriva come prima con la stima "non disponibile". #3: ogni passaggio di sfoltimento degli snapshot scrive una riga nel log dell'app (al massimo una al giorno quando non c'è niente da sfoltire), così si possono contare i passaggi uno per uno. #267: lo script di aggiornamento usa sudo per ogni comando docker sul nodo, così funziona anche senza l'utente umbrel nel gruppo docker. Sulla copia dei dati di produzione la configurazione del nodo si legge senza errori, tutte le operazioni LN Markets si leggono senza errori e le 29 celle del kernel sono identiche alla 0.14.28.
