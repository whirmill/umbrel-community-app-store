path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.7.6 moves spending limits and timings into an optional settings
  file, so you can change them without a new release. Telegram confirms each
  change after a restart. A file with a mistake stops payments and says which
  value is wrong.
