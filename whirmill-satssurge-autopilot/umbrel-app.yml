releaseNotes: >-
  Version 0.5.8 adds a mandatory application-owned lifecycle launcher with
  process-lifetime writer fences, consistent three-database checkpoints for
  release transitions, storage-only migrations and fail-closed recovery.
  SIGTERM and SIGINT stop admission and drain active HTTP handlers; incomplete
  drain is recorded as recovery required, not successful quiescence. Ordinary
  same-release restarts do not create another checkpoint. Interrupted migrations
  reuse their original transition identity and immutable baseline without
  restoring older financial receipts or OAuth state over newer data.
  A first update from a legacy dataset requires a separately qualified offline
  cutover: persistently exclude the known backfill writer, retire legacy restart
  paths, capture all three current databases with the target runtime and verify
  the effective immutable image pin before first startup. Hooks alone do not
  certify host exclusion; an unqualified legacy dataset refuses bootstrap.
  Telegram recovery still requires owner review through /recover and preserves
  original request, correction, job, conversation and submission identities.
  Uncertain delivery and financial effects are not automatically replayed.
  Schema 6, Pi Durable/Pi AI/Chord 1.1.0, mandate, budget limits, reserve,
  capability fences and the single financial executor remain unchanged.
  Immutable amd64/arm64 publication and isolated native lifecycle qualification
  are complete; installation and real web/Telegram acceptance remain pending.
  Autonomy remains suspended until explicit qualification. Accounting and
  historical coverage remain partial. M2.3/M2.4 and M3-M5 remain incomplete;
  optional financial integrations remain disabled.
