manifestVersion: 1
id: whirmill-satssurge-autopilot
category: finance
name: SatsSurge Autopilot
version: "0.1.3"
tagline: An evidence-driven Lightning routing agent
description: >-
  Pi Durable agent for autonomous Lightning fee experiments and circular
  rebalances, using a ChatGPT/Codex subscription. Private SQLite accounting,
  historical evidence, durable intent tracking and deterministic budget controls.
  Protects 500,000 on-chain sats. Mainnet POC: maximum 30,000 sats cumulative
  including history, 1,500 sats daily rebalance costs and 100 sats per attempt.
  Requires initial restricted LND credential provisioning and live automation
  interlock. The agent starts after OAuth login and successful reconciliation.
  Channels, Magma and Telegram are future milestones, not enabled capabilities.
developer: whirmill
website: https://github.com/whirmill/umbrel-community-app-store
repo: https://github.com/whirmill/umbrel-community-app-store
support: https://github.com/whirmill/umbrel-community-app-store/issues
port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.1.3 explicitly applies high reasoning effort to every GPT-6.1 Sol
  agent run and displays the reasoning level in the model section.
  Fee and rebalance executor only; no automatic channel, swap or marketplace
  operations. Retains partial accounting, historical import and durable
  recovery without uncertain payment replay.
