dependencies: [lightning]
releaseNotes: >-
  Version 0.5.10 uses native LND gRPC over verified TLS with the existing
  restricted credentials and no automatic RPC replay. Certificate diagnostics,
  advance expiry warnings and safe public-certificate reload preserve active
  calls. An optional passwordless user timer can copy LND's renewed public
  certificate; it does not renew certificates or restart the node.
  Generic Telegram /stop now offers confirmation for one exact turn, preventing
  delayed commands from stopping a successor. Explicit Stop buttons remain
  immediate. Long advisory prompts are attachments; /prompt ISSUE_ID REVISION
  retrieves an existing immutable prompt without changing its evidence.
  Application-owned lifecycle fences, current three-database checkpoints,
  fail-closed migration/recovery and original uncertain receipts are preserved.
  Schema 6 and Pi Durable/Pi AI/Chord 1.1.0 remain unchanged.
  Immutable amd64/arm64 images and isolated native qualification are complete;
  Umbrel installation and actual web/Telegram acceptance remain pending.
  Autonomy remains suspended under the existing maintenance claim. Mandate,
  budgets and reserve are unchanged. Coverage remains partial, M2.3/M2.4 and
  M3-M5 remain incomplete, and optional financial integrations remain disabled.
