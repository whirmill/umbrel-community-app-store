releaseNotes: >-
  0.14.12: Prelievi LN Markets: lo spazio lasciato sul saldo per la fee ora è in proporzione all'importo, come fa LN Markets (riserva lo 0,5 %): si prende la proporzione più alta dei nostri ultimi prelievi, più il 10 %, con un minimo di 10 sat. Un prelievo da 1.000 sat ora chiede 10 sat di spazio (prima 4.950); senza prelievi precedenti la stima resta prudente, 1 % dell'importo con un minimo di 100 sat. Nella console, la richiesta di prelievo in attesa dice in quanti pezzi parte, e per le proposte di una chat --telegram il modello non dice più "dalla console non si approva" quando console.fundApprovals è 1. Chat con il proprietario (#293): una singola proposta di fee o rebalance ora entra nel budget del turno anche quando la conversazione è lunga; con Claude Haiku il turno tiene da parte una riserva di contesto (agent.chatEvidenceReserveTokens, 12.000 token, 0 per toglierla) per l'evidenza che la proposta cita e per la proposta stessa, policy_view ed experiment_results restituiscono riassunti più brevi, e quando una lettura viene esclusa per il budget sotto la risposta compare "Letture non consegnate in questo turno: …".
