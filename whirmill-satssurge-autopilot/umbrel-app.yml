port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Le chat possono citare come prova i dati attuali (stato del nodo, economia, stima, mercato, storico fee); il valutatore vede le letture del turno; risposte della chat più compatte e ripartenza della chat a 40.000 token.
