releaseNotes: >-
  0.14.19: Lease e vendite Magma, ordini LSPS1 e operazioni e piani di canale vengono ora letti campo per campo. Un record danneggiato o vuoto non vale più come "nessun record": blocca il pagamento, l'accettazione o l'apertura prima che parta, invece di passare in silenzio. Se un record illeggibile ferma l'avvio, l'avviso ne indica il tipo, l'identificativo e il campo (per esempio "ricevuta Loop Out illeggibile: lo000004 limits.maxPrepaySat"), mai il valore, al posto del messaggio fuorviante su LND assente. L'esecuzione finanziaria resta ferma finché il record non viene corretto. Con dati validi non cambia nulla. Gli automatismi di fee e ribilanciamento (rifornimenti, scala dei prezzi, curva fee, ribasso delle sorgenti, sonde gratuite, proposte di canale del codice) e la raccolta nativa da LND ora leggono i propri record con controlli di tipo: un record salvato come vuoto (null) o con un campo malformato non viene più scambiato per "nessun record" né corretto in silenzio, ma ferma quel giro prima di qualsiasi sonda, modifica fee, rifornimento o bozza, indicando il record e il campo (mai il valore). Con dati validi il comportamento resta identico. Inoltre l'esecutore, quando una modifica fee su più canali viene interrotta, solleva sempre un errore standard senza cambiare l'esito dell'operazione (resta da riconciliare, mai ripetuta). Swap-out: dopo ogni ordine SatsSurge annuncia il robot usato ai relay del coordinatore, come fa il client RoboSats, così il tuo client aperto con la stessa garage key («Recupero» o la chiave incollata di nuovo) si apre sull'ultimo robot e sul suo ordine (swap.recoveryEvents, 1 di default); prima di ogni swap legge gli annunci della garage key e usa un robot oltre quelli già annunciati, e un ordine trovato già sul robot prima della nostra creazione si ferma senza pagamenti. /swap robots (e «swap robots» dalla console) elenca i robot usati con numero, nome e ordine, mai il token. Nella chat di uno swap il primo messaggio arriva appena la chat si apre, /swap say parte anche se la chat del coordinatore non si legge (con la chiave già nota della controparte), e i link nei messaggi della controparte non sono più cliccabili (hxxps[://], [.]) né mostrano anteprime. Pulizia del foglio di stile della dashboard (#290 F12): tolte le vecchie regole che nessuna pagina usava più e i colori "di transizione" (--tone-N e simili), sostituiti dai colori ufficiali del design system; il CSS scende da 76 a 45 kB (scaricato: da 16,4 a 11,9 kB compressi), quindi la dashboard si carica un po' più leggera. Non cambia nulla di visibile: ogni pagina è stata confrontata elemento per elemento, prima e dopo, in tema chiaro e scuro, su telefono e desktop.
