releaseNotes: >-
  Ammissione delle revisioni dalla politica deterministica, pronta ma spenta (agent.policyAdmission): quando sarà accesa, una revisione automatica partirà solo quando la regola fissa vede un'azione ammissibile o un cambiamento da segnalarti, oltre che per eventi materiali, blocchi e analisi richieste da te; l'attesa scelta dal modello non deciderà più nulla. Intanto gira in osservazione e le statistiche confrontano, decisione per decisione, l'ammissione di oggi con quella della politica. Corretto anche un difetto per cui alcuni segnali di revisione dei corridoi potevano saltare un ciclo di calcolo.
