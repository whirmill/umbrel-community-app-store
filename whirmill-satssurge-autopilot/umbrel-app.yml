defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  0.14.22: I conteggi delle letture delle celle del kernel (per consumatore e per cella, ora per ora) e il riepilogo giornaliero delle esecuzioni del kernel (riuscite, fallite, in errore, ritardo massimo) ora restano salvati anche dopo un riavvio, per 30 giorni (nuova impostazione kernel.countersDays). Vengono scritti una volta al minuto e allo spegnimento: un arresto improvviso perde al massimo l'ultimo minuto. La riga delle statistiche "Celle del kernel" mostra l'ultima ora, le ultime 24 ore e gli ultimi 7 giorni al posto del totale "dall'avvio". Così i criteri per accendere una funzione su più giorni (per esempio "ripieghi al massimo 2 % in 7 giorni") si possono verificare anche dopo un aggiornamento; i 7 giorni completi decorrono dal rilascio.
