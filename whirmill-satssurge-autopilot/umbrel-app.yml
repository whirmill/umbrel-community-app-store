dependencies: [lightning]
releaseNotes: >-
  Version 0.4.3 adds dedicated owner login before the protected shell, including
  initial token verification. Header Esci and Settings logout revoke the owner
  session through the authenticated CSRF-protected endpoint, preserving OAuth,
  autonomous jobs, saved nonce and draft. Teardown prevents stale callbacks from
  repopulating history or reopening polling/SSE; focus returns to password.
  Includes official searchable model menu/provider logo, keyboard/focus support
  and causal test-only mock timing correction. CI 37964740620 passed 149 Node 24
  and 16 Python tests. Anonymous amd64/arm64 configs and all 22 layers passed
  SHA-256/size checks against source 4c40a17f688315977fcb192a5b979831231aae55;
  extracted package is 0.4.3 and both commands use flock --no-fork. Actual
  installed acceptance remains pending. Local 24 authenticated and 8 light/dark
  login responsive cases passed with no shell leaks/overflow and empty console.
  Preserves schema 4, financial mandate and original receipts; no financial
  acceptance test, regtest, M3/M4 capability or profitability qualification.
