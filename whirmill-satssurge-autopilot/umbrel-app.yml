gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Proposte con una prima riga leggibile (per esempio "Fee di ACINQ: 120 → 130 ppm"); il valutatore in chat riceve mandato e limiti dei canali coinvolti; i piani canali sono descritti per intero agli agenti e in /status; i pulsanti spariscono quando la proposta è decisa.
