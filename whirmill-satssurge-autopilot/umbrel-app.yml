port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.22 lets the agent measure each channel and propose opening new
  channels or cooperatively closing weak ones, to balance liquidity through
  return routes instead of rebalancing. Every channel operation runs only after
  you approve it in Telegram; closes are never forced; on-chain fees are capped
  at 20,000 sats per month and new channels at 500,000-2,000,000 sats. Channel
  features need a separate restricted LND credential (scripts/provision-channels.sh).
  The operational database now grows far more slowly, and a retention issue that
  could have blocked automation after 90 days is fixed.
