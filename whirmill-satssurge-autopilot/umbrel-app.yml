dependencies: [lightning]
releaseNotes: >-
  0.14.34: la verifica oraria del calcolo incrementale e fee_history non leggono più le vecchie celle fee-window delle decisioni chiuse da oltre 8 giorni. Quelle celle erano rimaste a una versione precedente. Così generavano un falso "fallback" circa ogni ora nei contatori del kernel e voci "unavailable (cell_version)" nello storico fee. Ora la verifica controlla solo le decisioni che il kernel calcola ancora. Per una modifica fee più vecchia, fee_history mostra il confronto prima/dopo dalla valutazione a 7 giorni salvata; se quella manca, indica "finestra chiusa" senza cifre. Sulla copia dei dati di produzione le celle del kernel sono identiche a quelle della 0.14.33, e tutte le 26 modifiche fee riuscite mostrano una finestra. Nessun dato viene cancellato; nessuna impostazione, versione o schema cambia.
