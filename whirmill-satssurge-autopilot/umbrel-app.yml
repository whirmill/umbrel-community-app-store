releaseNotes: >-
  0.14.26: #274, quarto blocco della tipizzazione. Il server web risponde 500 invece di fermarsi quando una richiesta con un indirizzo illeggibile fa fallire il gestore, e se all'avvio non riesce a registrare il proprio blocco esce con una riga fissa; il budget di una ricerca, che decide se un'azione finanziaria può ancora partire, viene letto in modo rigoroso e un record danneggiato blocca con il nome del campo, mai con un conteggio sbagliato. Sono tipizzati anche la sorgente LND nativa, gli HTLC, Magma, gli impegni on-chain (stessa regola prudente sugli importi), le misure dei canali, la salute del kernel, i pagamenti esterni e tutte le formule del kernel, poi i turni Telegram (correzioni e pulsante Stop restano rigorosi), i costi per tipo di lavoro, le fonti di evidenza, le chiusure dei canali, lo storico e i dati della pagina web. Con dati validi non cambia nulla: sulla copia dei dati di produzione tutti i record letti in modo rigoroso si decodificano senza errori e le uscite (impegni del wallet, pagamenti esterni, costi, chiusure, salute del kernel, offerte Magma e le 29 celle del kernel) sono identiche a quelle della 0.14.25, con lo stesso costo di calcolo.
