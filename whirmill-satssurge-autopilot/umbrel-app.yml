gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.2.1 adds the persistent request queue, one coordinator and at most
  two read-only analysts, qualified host diagnostic projections, public fee
  competition and immutable 7/30-day evaluations. Schema 3 adds durable
  maintenance fencing; consistent three-database checkpoints support updates.
  Owner login uses an origin-scoped eight-hour bearer session. GPT-6.1 Sol/high
  and subscription OAuth remain configured. M1.1/M1.2/M2 are locally implemented;
  release and live acceptance remain required. The historical evaluation overlap
  fixture now clones a valid original proposal; all 54 tests pass on Node 24.21.0.
  Financial limits are unchanged;
  no channel lifecycle, Magma, Telegram or profitability qualification.
