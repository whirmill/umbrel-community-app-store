dependencies: [lightning]
releaseNotes: >-
  Scala dei prezzi per i canali svuotati: gradini del 40% proposti al proprietario (entro il passo automatico eseguiti in automatico), stop e ritorno al gradino precedente quando la domanda rifiutata cala, prezzo scoperto fermo per 14 giorni e ribasso solo con ore valide senza domanda. Dopo ogni modifica fee su un canale svuotato, e ogni settimana, una sonda gratuita cerca la rotta di rifornimento sotto il nuovo tetto. Quando un canale svuotato regge un prezzo alto con domanda costante e ci sono fondi on-chain, il nodo propone un canale parallelo con il confronto dei costi; l'apertura resta sempre una tua approvazione.
