defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  La domanda rifiutata si conta in episodi (il rifiuto più grande per canale in entrata e ora), non più in pagamenti ripetuti; ogni rifiuto registra la fee offerta dal mittente. Gli esperimenti di fee sui canali svuotati hanno un esito sulla domanda rifiutata (persiste, calata o non determinabile) contato sulle ore in cui i canali che li alimentano hanno liquidità. Il riepilogo di una proposta già decisa mostra la fee di partenza corretta.
