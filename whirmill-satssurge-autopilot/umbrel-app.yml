releaseNotes: >-
  Version 0.4.4 repairs bounded research continuity, automatic scope admission,
  economic qualification and exact sector/attribution accounting. Chat and
  Activity retain measured progress, coverage gaps, blockers and next triggers
  through refresh and SSE replay. CI 37978839715 passed 172 Node 24 and 16 Python
  tests. Both amd64/arm64 images and all 22 layers passed anonymous SHA-256/size
  verification against source 77a48c25d7891aa595293319c36ae2444091cdd6.
  Additive schema 5 preserves original ledger, reservations, financial receipts,
  conversations and submissions. Before installation, stop the executor and
  checkpoint all three databases; preserve owner secret and mounted credentials
  separately with original permissions. Schema-4 software refuses schema 5;
  never restore older receipts over newer or uncertain effects or replay payments.
  Installed acceptance remains separate. Shared/unassigned costs retain partial
  accounting and unknown routing contribution; no profitability qualification
  or expansion of the financial mandate.
