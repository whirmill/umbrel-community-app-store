defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.11 corrects Telegram response composition: a stable preview by
  default, a coherent partial prefix for long answers, and one bounded rich
  final response. Oversize legacy replies preserve Unicode and natural text
  boundaries. Explicit owner stream preferences and historical delivery
  receipts are retained. Only a proven rich API rejection selects an exact
  text attachment on a later bounded attempt; uncertain delivery is not replayed.
  Exact-target Stop, owner/bot fences and shared rate limits remain intact.
  Native LND gRPC with verified TLS, certificate diagnostics and the optional
  public-certificate copy timer remain unchanged. The timer does not renew
  certificates or restart the node. Application-owned lifecycle, current
  three-database checkpoints, schema 6 and Pi Durable/Pi AI/Chord 1.1.0 remain.
  Immutable amd64/arm64 images and isolated native qualification are complete;
  0.5.11 Umbrel installation and actual Telegram Web acceptance remain pending.
  Autonomy remains suspended under the existing maintenance claim. Mandate,
  budgets and reserve are unchanged. Coverage remains partial, M2.3/M2.4 and
  M3-M5 remain incomplete, and optional financial integrations remain disabled.
