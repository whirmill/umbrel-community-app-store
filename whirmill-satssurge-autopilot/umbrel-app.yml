port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.19 makes Telegram previews show the message that will be
  delivered, with a progress line during tool work and a moving tail on long
  answers, updated more often and without long stalls. The daily digest now
  separates the routing net from swaps and other costs, rebalances by type,
  distinct refused payments from retries, and charges cooperative closes with
  the on-chain fee actually paid. Budget and mandate limits are unchanged.
