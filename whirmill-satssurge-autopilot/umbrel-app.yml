releaseNotes: >-
  0.14.18: Controlli più severi sui dati degli swap-out (#274, seconda parte): le ricevute dei pagamenti hold, gli ordini RoboSats, gli indirizzi di swap e le risposte di LND (decodifica delle fatture, nuovi indirizzi, elenco dei pagamenti) vengono ora letti campo per campo. Un dato rovinato o vuoto ferma l'operazione con un errore chiaro prima di qualsiasi pagamento, invece di essere scambiato per "nessuna ricevuta" (che in teoria avrebbe permesso di pagare due volte la stessa fattura). Con dati validi non cambia nulla: stessi testi, stessi importi, stesse decisioni. Loop Out più robusto contro dati corrotti (#274, terza parte): le ricevute dei Loop Out, il registro del pagamento del token L402, l'osservatore Loop, lo stato dell'avvio automatico e il file del token vengono ora verificati campo per campo alla lettura, come le risposte del server Loop e di LND. Un importo malformato o una ricevuta vuota non vengono più scambiati per "nessun pagamento": l'operazione si ferma prima di pagare o incassare, quindi il token L402 non può più essere pagato due volte. Con dati validi nulla cambia per il proprietario. Controllo dei dati LND più rigoroso: ogni risposta di LND (stato del nodo, canali, pagamenti, inoltri, apertura e chiusura canali, fatture) viene verificata campo per campo; un campo mancante o del tipo sbagliato ora ferma l'operazione con un errore chiaro invece di registrare valori senza senso. Un pagamento storico illeggibile viene saltato e contato, senza più bloccare la raccolta dati; un pagamento circolare nostro con importi illeggibili invece la sospende (codice malformed_payload), così nessuna spesa va persa. Nessun cambiamento con dati validi. Dashboard: la copertura del registro ora dice perché è parziale (storico prima dell'installazione non certificato, costi senza attribuzione, discrepanze dell'importazione) nel riepilogo Telegram e su Canali; la prima pagina carica circa la metà del JavaScript (la Conversazione si carica solo quando la apri); Approva e Rifiuta sono nella pagina Proposte (stesso comportamento, prima in Impostazioni) e Impostazioni è divisa in sezioni; Canali, kernel e spazio del database sono schede leggibili; l'autonomia su Panoramica conta gli swap puliti e i passi puliti della scala delle commissioni.
