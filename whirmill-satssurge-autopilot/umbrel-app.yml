gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Swap-out: le chiamate degli ordini (robot, creazione, lettura) contano nell'affidabilità dei coordinatori e un coordinatore che non le serve passa in fondo finché non risponde (al massimo swap.callOutageHours, 6 ore); un ordine mai creato fallisce da solo dopo 10 minuti senza chiamare il coordinatore, nessun ordine né pagamento.
