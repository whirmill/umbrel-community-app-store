releaseNotes: >-
  0.14.25: le fotografie dei canali (snapshot) vengono sfoltite a livelli (#3): restano tutte, una al minuto, per 32 giorni (storage.snapshotMinuteDays), poi una per ora fino a 60 giorni (nuova impostazione storage.snapshotHourDays), poi una per giorno; restano sempre quelle a cui un'operazione, una proposta, un'operazione di canale o l'ultimo inoltro di un canale fanno riferimento. Il giorno dopo ogni variazione di commissione SatsSurge conserva il campione "prima" (i 30 giorni precedenti) che la valutazione a 30 giorni userà, con lo stesso calcolo, così il risultato resta identico e le fotografie al minuto non devono più restare per circa 60 giorni: la tabella si stabilizza intorno a 230 MB invece di 430 MB. Sulla copia dei dati di produzione i primi passaggi conservano 25 campioni e poi lo sfoltimento elimina circa 8.000 fotografie vecchie; per ridurre davvero il file serve poi una compattazione (VACUUM). "satssurge storage" e la scheda Spazio del database mostrano le righe per livello e l'ultimo sfoltimento. #274: l'archivio canonico, la seconda parte di Telegram (anteprime, /recover, risposte pronte, esiti, note del valutatore, avvisi su LND e provider) e brief del kernel, storico fee, notifiche del nodo, revisione della strategia, grafici e pannelli tecnici leggono i dati con decodificatori tipizzati: con dati validi non cambia nulla (testi, identificativi e digest identici), un record informativo danneggiato viene saltato e contato invece di bloccare, mentre importi, migrazioni, approvazioni, il pulsante Stop e il punto di ripresa della cattura della storia nativa restano rigorosi; la verifica sulla copia dei dati di produzione ha letto tutti i record senza errori. La cella dei pagamenti esterni (scheda di Contabilità e riga del riepilogo Telegram) costa molto meno: sulla copia dei dati del nodo circa 25 ms per ciclo invece di circa 120, con risultati identici.
