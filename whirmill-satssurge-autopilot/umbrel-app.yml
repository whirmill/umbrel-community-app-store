releaseNotes: >-
  Swap-out: l'ordine dei coordinatori ora segue le misure (raggiungibilità, storico dei nostri swap per coordinatore, costo previsto con le fee di routing misurate) e swap.coordinators decide solo a parità, con il motivo in italiano su decisione, rapporto del kernel e Approva; la parità swap riparte al cambio di versione e non conta più il testo d'errore di un coordinatore; le celle giornaliere del kernel e swap-decision non saltano più uno slot né girano due volte; il modello vede la decisione che l'avvio automatico giudica.
  
  Swap: lo storico per coordinatore conta ora i fallimenti del coordinatore (prima leggeva le righe contabili finali e non ne contava nessuno, es. sw000001 su lake); la riga di confronto cella/runtime dice "il confronto ricomincia alla prossima decisione" invece di mostrare i conteggi della versione precedente; la decisione della cella riporta la propria versione (sw-v7).
