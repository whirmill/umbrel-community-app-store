dependencies: [lightning]
releaseNotes: >-
  Version 0.3.3 refines the responsive interface with semantic colors,
  interactive charts, compact details, filtering and sorting. Reactive event
  subscriptions and async generator streams deliver durable UI updates after
  database commits, with replay, deduplication and reconnect handling.
  Retains the Umbrel HTTP request-ID fix, Pi Durable, subscription OAuth,
  the guarded executor and existing financial limits. CI passed 84 Node and
  15 Python tests. Immutable amd64/arm64 images identify source
  1a0481580cfa9cc702558d982cabe7476ba1c4fa; both platforms and all image layers
  passed anonymous registry download and digest verification.
  Installation and live acceptance of this release remain pending.
  No channel lifecycle, Magma, Telegram or profitability qualification.
