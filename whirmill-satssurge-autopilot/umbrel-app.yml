releaseNotes: >-
  Version 0.5.7 requires owner review through /recover before resuming historical
  read-only Telegram requests. Expired or late correction choices mature into
  separate review views in bounded batches; nested recovery validates every
  ancestor hash and rejects missing, changed, cyclic or over-128-reference chains.
  Original ingress, correction, request, job, conversation and submission receipts
  remain preserved. Resume keeps the original request identity and new-request
  constraint; it does not replay an expired steer or admit duplicate work.
  Callback expiry accounts for the entire processing batch, including earlier ACK
  waits and recursive recovery. Owner, bot, binding, generation and receipt checks
  remain active after ACK. Existing consumed choices and native submissions retain
  their original ownership. Uncertain delivery and financial effects are not replayed.
  Diagnostic advisory prompts identify collector, LNDg or Lightning Mate origin
  while preserving prior revisions and checksums. Pi Durable/Chord 1.1.0 native
  equivalence fixtures and qualification documentation cover isolated native
  behavior; application runtime adapters have not been removed or replaced.
  Schema 6, Pi Durable 1.1.0, current mandate, budget limits, capability fences
  and the single financial executor remain unchanged. Autonomy remains suspended
  until explicit qualification. Accounting and historical coverage remain partial.
  Take a fresh stopped three-database checkpoint before update and preserve current
  OAuth tokens, original receipts and uncertain-effect reconciliation. Compatible
  software rollback preserves current data; never restore older receipts or tokens
  over newer state. Immutable amd64/arm64 publication and installed acceptance are
  still pending for 0.5.7. M2.3/M2.4 installed acceptance and M3-M5 remain incomplete;
  optional financial integrations remain disabled.
