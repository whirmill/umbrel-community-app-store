path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.20 retries a Telegram answer once, automatically, when the model
  connection drops for a moment (read-only questions only). Tables in answers
  are now shown as readable lists instead of raw text. The agent now sees
  routing results separately from startup, capital and swap costs, so manual
  setup expenses no longer look like routing losses. Financial execution,
  mandate and the owner /resume control are unchanged.
