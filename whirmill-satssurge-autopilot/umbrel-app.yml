port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.67 gives the agent the full fee history (owner-approved,
  automatic and external changes, with the rule each one followed) and an
  exact explanation of local and remote liquidity. Refill limits now show
  the break-even and the owner's mandate cap separately, and every refused
  payment count states which rule it uses.
