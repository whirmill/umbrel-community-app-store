releaseNotes: >-
  0.14.5: On-chain fuel, fase 0 (#278, #279 punti 6–7): i fondi già impegnati restano a chi li ha impegnati per primo. Un'apertura di canale (proprietario, veto, fase 5, piani) non usa più i sat di una vendita Magma o LSPS1 accettata e non ancora aperta, né quelli di un'apertura proposta o nella finestra di veto; una vendita vede a sua volta le aperture in attesa. Il massimo pubblicato dell'offerta Magma non supera i fondi finanziabili adesso (fee di apertura compresa) e il motivo per cui l'offerta non prende ordini è salvato, visibile nella scheda web e annunciato una sola volta su Telegram. Le aperture automatiche lasciano spazio a una vendita della taglia minima finché le vendite sono attive; per le aperture del proprietario il messaggio avvisa quando non resterebbe spazio. Un solo rifornimento on-chain alla volta: niente swap-out RoboSats con un Loop Out in corso e viceversa. La riserva anchor di LND compare accanto alla riserva protetta.
