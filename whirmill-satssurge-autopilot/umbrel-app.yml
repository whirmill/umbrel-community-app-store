releaseNotes: >-
  0.14.16: Fondi degli swap-out in un nuovo canale, con un solo cancello (#259). C'è un nuovo interruttore, swap.fundOpen, spento di default. Quando è acceso: appena i fondi di uno swap-out RoboSats completato sono confermati, SatsSurge propone l'apertura di canale pianificata. Passa per il cancello fondi-apertura, che oggi è una cella del kernel calcolata ogni intervallo: serve un candidato qualificato della fase 5; valgono i limiti channels.*; con fuel.source 1 l'apertura non tocca i fondi della vendita Magma/LSPS1. L'apertura segue la strada normale dei canali: finestra di veto o Approva del proprietario. L'Approva dello swap non vale come approvazione dell'apertura. Se il cancello rifiuta, se la cella manca o se la proposta non parte, i fondi restano sul wallet e un messaggio lo dice. L'incasso dei Loop Out nel canale (loop.sweepToChannel, ancora a 0) usa la stessa cella. Le statistiche mostrano lo stato del cancello e l'ultima decisione, con l'orario della cella.
