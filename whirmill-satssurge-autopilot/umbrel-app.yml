dependencies: [lightning]
releaseNotes: >-
  0.14.11: Percorso di rifornimento (in prova): SatsSurge ora calcola, per il bisogno di benzina on-chain, quale via conviene tra Loop Out e RoboSats: per ciascuna dice l'importo possibile (limiti, capienza dei canali, rotte misurate verso il nodo LOOP, budget del mese), il costo atteso tutto compreso in ppm con il rischio del prepagamento o della cauzione, il tempo per avere i fondi e la nostra storia, e sceglie la migliore senza guardare se parte da sola. La vedi nelle statistiche, nel riepilogo della chat e nella card "Percorso di rifornimento" in Panoramica accanto a "Benzina on-chain", con l'ora del calcolo; se manca, la riga dice perché. Nessuna decisione la usa ancora: gli avvii di Loop e RoboSats restano quelli di oggi. Nuove impostazioni route.source (0, l'1 non ha effetto fino alla fase 3), route.failPriorPercent (5), route.costTiePpm (300) e route.recordDays (90).
