port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.2 adds the five-button inline menu, visible command menu, callback
  expiry validation, Thinking feedback, rolling long previews and full final
  delivery. Nonempty rich thinking fixes Telegram's RICH_MESSAGE_EMPTY rejection
  of the initial empty placeholder. Existing Telegram durable turns, native Stop,
  explicit correction choices and independent read-only coordinator remain intact.
  CI 38029485714 passed 239 tests on Node 24.21.0 and 16 Python tests. Anonymous
  amd64/arm64 manifest/config and all 22 compressed layer SHA-256/size checks passed
  against source 513e30c99437f75bc0c5cd7181d1bd47388361cc. Pi Durable remains 1.1.0;
  schema 6 and the existing financial mandate are unchanged. Actual 0.5.0 Stop and
  semantic steering passed; new 0.5.2 client UX acceptance remains pending.
  Before installation stop the executor, checkpoint all three databases and preserve
  owner.secret, telegram.secret and mounted credentials with their permissions.
  Rollback requires compatible software and preservation of newer or uncertain receipts;
  never restore older databases over newer effects or replay payments/uncertain deliveries.
  Schema-5 software refuses schema 6. Already dispatched messages may finish after
  revocation. Profitability accounting remains partial.
