dependencies: [lightning]
releaseNotes: >-
  Aperture e chiusure dei canali indicano il nodo per nome (per esempio "verso kappa") e gli importi con i separatori; esito esperimento e bilancio a 7 giorni con gli stessi numeri arrivano in un solo messaggio; gli avvisi di blocco sono in italiano e dicono cosa resta sospeso; gli avvisi del valutatore indicano azione e canali per nome; le scadenze dei piani sono in ora italiana.
