releaseNotes: >-
  0.14.9: Approvazioni dalla console e osservatore Loop (#286, #276 fase 1). Con la nuova impostazione console.fundApprovals a 1 (spenta di default) la console del nodo elenca le richieste Approva di swap-out, Loop Out e LN Markets (satssurge approvals) e le approva o rifiuta (satssurge approve|reject <ref>) con gli stessi controlli del pulsante su Telegram: scadenza, una sola decisione valida tra Telegram e console, poi dati freschi, mandato ed esecutore come sempre; approva anche le proposte di chat --telegram dopo la consegna. Ogni decisione arriva su Telegram come «Approvato dalla console: …» o «Rifiutato dalla console: …» (in silenzio nelle ore di quiete), toglie i pulsanti dal messaggio della richiesta e resta nell'audit della console; la scala delle approvazioni e i budget non cambiano, e rimettendo 0 si torna a Telegram soltanto. Con loop.enabled 1, ogni loop.observeEveryHours ore (predefinito 6, 0 = spento) SatsSurge legge dal server Loop i termini e un preventivo gratuito a tre importi (loop.minSat, 500.000 e loop.maxSat), la fee on-chain stimata e verifica la rotta verso il nodo LOOP, senza mai mandare né pagare il token L402 e senza creare swap o fare pagamenti; si ferma mentre un Loop Out è in corso, e /loop mostra la riga "Osservatore Loop" con i preventivi e l'ora della lettura, oppure il motivo per cui non è riuscita.
