dependencies: [lightning]
releaseNotes: >-
  Kernel first: tutte le letture del calcolo incrementale passano da un'unica regola (versione, errori, età) con ripiego contato; swap-out, domanda rifiutata e candidati della fase 5 diventano celle del kernel (affidabilità dei coordinatori, rotte conservate, costo degli swap, decisione swap), con il calcolo di prima come ripiego e confronto nelle statistiche; il costo previsto dello swap entra nel conto delle aperture; avviso se un ordine swap pubblico resta irraggiungibile 30 minuti, critico con la garanzia fuori; ogni ordine swap indica il suo robot RoboSats (robot n. N «nome», nel Garage «Robot #N»). Nessuna modifica al database.
