defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.20 charges channel closes confirmed before 0.9.19 with the
  on-chain fee actually paid, computed by the app from LND and its own
  snapshots instead of the reserved maximum. Budget and mandate limits are
  unchanged.
