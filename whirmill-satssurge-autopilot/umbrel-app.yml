dependencies: [lightning]
releaseNotes: >-
  Version 0.2.2 preserves the Umbrel app-proxy session on same-origin API calls,
  fixing the external browser login redirect. Autopilot still requires its
  separate explicit bearer session; cookies alone grant no owner authority.
  Origin and CSRF checks remain enforced. CI passed 54 Node and 14 Python tests;
  immutable amd64/arm64 images identify source c7febdb982be086ee59981e162e09bb4d7ddfa92.
  Retains the persistent queue, one coordinator, two read-only analysts,
  qualified diagnostics and immutable 7/30-day evaluations. Installed 0.2.1
  passed bounded schema 3 and concurrency qualification; 0.2.2 installation
  and external proxy acceptance remain pending. Financial limits are unchanged;
  no channel lifecycle, Magma, Telegram or profitability qualification.
