defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.3.6 corrects terminal conversation and Activity presentation found
  during installed 0.3.5 qualification. Failed responses without text are
  explicitly incomplete; cancelled/completed empty responses retain their true
  state. Terminal rows no longer show stale progress or active-wait placeholders.
  Original sanitized errors appear behind collapsed lazy Dettaglio errore,
  escaped as text, without inferring a cause. Preserves original private receipts,
  public summaries, schema 4, mandate and financial executor. Retains 0.3.5
  scoped evidence, persisted run budgets, virtual/GFM history, themes and mobile
  16px focus/safe areas/manual zoom. CI 37932221537 passed 113 Node 24 and
  16 Python tests. Anonymous amd64/arm64 configurations and all 22 image layers
  passed SHA-256/size checks against source
  32a2d0feaa9313146864ba9e163227298548a688; package version is 0.3.6 and both
  commands use flock --no-fork. Installed 0.3.6 qualification remains pending.
  Local terminal/320px fixture passed; native iOS and VoiceOver are unverified.
  No financial acceptance test, regtest, M3/M4 capability or profitability
  qualification is introduced.
