port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Due modelli con la chiave Anthropic: Claude Haiku 5.5 esegue (analisti, ricerca, note) e Claude Sonnet 5.5 valuta ogni decisione automatica prima che abbia effetto (approva, respinge o aspetta, con i motivi registrati). Nelle chat il valutatore risponde con /evaluate, con "chiedi al valutatore" o quando la chat crea una proposta. Gli accorgimenti per la soglia dei 100K token si applicano solo ai modelli con tariffa a fasce.
