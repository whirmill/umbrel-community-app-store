gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Swap-out automatici: con swap.autoStart il nodo avvia da solo lo swap quando serve per un'apertura (approvazione tua per i primi due), verifica la rotta verso il coordinatore prima di creare l'ordine e ricorda il premio a cui è stato preso l'ultimo ordine. I messaggi in chat di chi prende l'ordine arrivano su Telegram come testo non verificato; nuovi comandi /swap say e /swap start; /swaps nel menu. Nessuna modifica al database.
