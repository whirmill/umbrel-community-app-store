gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.39 removes data that earlier versions recorded incorrectly:
  duplicate archive copies, the legacy HTLC stream records, empty history
  projections and keys of removed features (schema 13). Unchanged and
  restart-duplicate policy captures follow the 90-day rule, and Telegram
  transport copies keep only their ids after 90 days. Ledger, operations,
  payments and forwards are unchanged. Image downloads no longer block the bot.
