port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  0.14.13: Numeri più leggibili e coerenti nei messaggi: gli importi che arrivano in millisat (costo di un rebalance o di uno swap, fee di un inoltro, fee di instradamento LN Markets e Loop, token L402) si leggono in sat con al massimo un decimale ("costo 44,4 sat" invece di "44,412 sat", "99 sat" invece di "98,999 sat"); i resoconti di Magma, LSPS1 e della chiusura di un canale arrotondano al sat invece di troncare e usano il segno meno vero; le percentuali usano un decimale troncato ("20,9 %", "+40 %", "probabilità 70 %"); i numeri da quattro cifre hanno il punto delle migliaia anche nel riepilogo, nelle statistiche degli swap, nei testi di Approva di LN Markets e Loop e nei candidati canale ("1.942 sat", "2.500 ppm"). Il millisat esatto resta nelle ricevute, nel registro contabile e nell'output --json; nessuna decisione, limite o budget cambia.
