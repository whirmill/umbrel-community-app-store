releaseNotes: >-
  0.13.2: risolti i seguiti del kernel-first e della revisione 0.13.1 (celle aggiornate subito dopo un aggiornamento e senza slot saltati, bisogno swap già al primo giro dopo il riavvio, allarmi swap senza falsi "coordinatore non risponde" quando l'errore è di LND, ripieghi delle celle mostrati sull'ultima ora, bisogno e primo candidato al netto dello swap stimato con il motivo, fino a 6 coordinatori RoboSats ammessi).
