releaseNotes: >-
  Version 0.5.6 recovers delayed owner read-only Telegram requests after downtime,
  including status/help/menu/queue messages previously ignored by the expiry
  limit. Consequential commands and stale ownership contexts retain their expiry
  and safety checks. Recovery preserves original request/delivery identities;
  missing or changed original records expire safely after a restart or re-pairing.
  Telegram streaming, targeted Stop, correction choices and advisory development
  prompts retain the earlier core fixes. Same-client streaming and long prompt
  attachment acceptance remain required after installation.
  CI 38056581314 passed 348 Node tests and 16 Python tests and published verified
  amd64/arm64 images from 96eef99ab45cf129d2a5d6e72d25b6fc7a42ffdc.
  Schema 6 and Pi Durable 1.1.0 remain unchanged. Preserve current OAuth tokens,
  original receipts and uncertain-effect reconciliation through a fresh stopped
  three-database checkpoint before update. Compatible software rollback preserves
  current data; never replace newer receipts or tokens with earlier backups.
  M2.3/M2.4 installed acceptance and M3-M5 remain incomplete. Optional financial
  integrations remain disabled; accounting and historical coverage remain partial.
