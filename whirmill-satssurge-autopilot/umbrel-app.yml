defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.14 adds scoped, protected controls for Lightning Mate, LNDg,
  Lightning Terminal and Alby Hub, using a sanitized read-only directory. Missing,
  stale or incomplete evidence holds financial execution while native collection,
  reconciliation, diagnostics and owner read-only tools continue. Schema 7
  preserves all 19 original legacy tables in immutable archives. Pi Durable,
  Pi AI and Chord remain 1.1.0; OAuth, original identifiers and financial receipts
  remain preserved. Agent-generated HTML/DLS source is present with its feature
  disabled pending M3 acceptance and separate rendering/attachment qualification.
  The image index is immutable for amd64 and arm64. Live migration, semantic
  parity, protected controls and web/Telegram acceptance remain separate gates.
  Autonomy stays suspended under the original claim, mandate, budgets and reserve.
  M3 completion, actual rendering/exports and optional integrations remain pending.
