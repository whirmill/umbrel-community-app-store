defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.4.5 adds the paired owner's Telegram interface: durable chat,
  guarded pause/resume, explicit proposal review, daily accounting digest and
  critical blocker alerts. Web settings configure the private bot token and
  numeric-owner pairing; Telegram stays disabled until configured.
  CI 38022783273 passed 192 Node 24 and 16 Python tests. Both amd64/arm64 images
  and all 22 layers passed anonymous SHA-256/size verification against source
  3608a062ae09353059eba2dead54693032933c3b. Additive schema 6 preserves the original
  ledger, mandate, jobs, Pi submissions and financial receipts. Stop the executor
  and checkpoint all three databases before installation; preserve owner.secret,
  telegram.secret when present and mounted credentials with original permissions.
  Schema-5 software refuses schema 6; never overwrite newer or uncertain receipts
  or replay payments or uncertain Telegram deliveries. An already dispatched
  message may complete after revocation. Installed migration and live bot pairing
  acceptance remain separate. The existing fee/rebalance mandate and partial
  profitability accounting remain unchanged.
