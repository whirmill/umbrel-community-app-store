dependencies: [lightning]
releaseNotes: >-
  0.14.8: Benzina on-chain in prova e cruscotto più chiaro (#278 fase 1, #269). SatsSurge calcola ora in un solo punto, come cella del kernel onchain-fuel, quanti fondi on-chain sono liberi sopra la riserva (o la riserva anchor di LND, se più alta) e gli impegni già presi, quanto si può pubblicare come massimo di vendita Magma e LSPS1, fin dove può arrivare un'apertura automatica lasciando una vendita finanziabile, il saldo obiettivo (mai sotto il tuo swap.targetOnchainSat né sopra swap.maxIdleOnchainSat) e l'eventuale ricarica, una alla volta. È solo in prova: nessuna decisione la usa ancora e aperture e vendite seguono i controlli dal vivo della 0.14.5; la vedi nelle statistiche, nel riepilogo della chat e nella nuova scheda "Benzina on-chain" della Panoramica (se la cella manca, la scheda dice perché e non mostra cifre). Nuove impostazioni: fuel.source (0; 1 riservato alla fase 2, oggi senza effetto), fuel.priority (sales) e fuel.combine (max). Il riepilogo Telegram parla come la web app: "Margine operativo del routing (ultimi 30 giorni)" con la stessa cifra, poi a parte i costi on-chain dei canali e il risultato complessivo; tutti gli importi in sat sono arrotondati con il punto delle migliaia e le percentuali hanno un decimale, mai sopra il valore misurato. In Panoramica la scheda "Magma e Loop" dice se l'offerta su Amboss è pubblicata o perché no, con volume e costo dei Loop Out del mese; in Contabilità la sezione "Pagamenti esterni a SatsSurge" elenca, solo per informazione e fuori dal conto, i pagamenti fatti dal nodo con un altro wallet o app, come quello a Bitrefill del 24 ottobre, senza fattura, memo o hash.
