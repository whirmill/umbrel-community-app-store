releaseNotes: >-
  0.14.24: #274, ondata D (seconda parte): gli strumenti dell'agente che toccano denaro (esecuzione delle decisioni, proposte di fee, rebalance e canali, piani di canali, lease Magma, probe, chiusura delle revisioni) controllano i propri argomenti con decodificatori tipizzati dopo la validazione dello schema e prima di qualsiasi lettura, budget, richiesta al valutatore o effetto; la console del proprietario controlla ogni richiesta campo per campo prima di eseguire il comando (un campo sbagliato è rifiutato con codice 2, senza effetti) e un registro di audit illeggibile ferma i comandi che scrivono; Telegram legge in modo tipizzato aggiornamenti, outbox, pulsanti, tastiere, riquadri e associazione: un aggiornamento malformato non blocca più il polling né la coda (viene saltato e contato nello stato Telegram), una riga dell'outbox malformata fallisce da sola; ricerca, viste delle evidenze, node_state, autonomia canali, concorrenza, policy native e fatti di ricerca leggono dati tipizzati, e un record malformato che decide un'azione automatica (proposta con veto, sospensione di un peer, fatto di ricerca) ferma l'azione nominando il campo. Le statistiche non si bloccano più per un record informativo illeggibile (ribilanciamenti, domanda rifiutata, operazioni dei piani canali, decisioni recenti, finestre di valutazione): viene saltato e contato con una riga che nomina chiave e campo, mai il valore; le cifre di denaro restano rigorose. Con dati validi testi, proposte e risposte al modello restano identici; la verifica su una copia dei dati di produzione ha letto tutti i record senza errori bloccanti. #253: con swap.policyYield 1 (di serie) curva fee, rifornimenti e scala dei prezzi non agiscono su un canale con uno swap-out RoboSats o un Loop Out in corso e dicono perché, e uno swap, Loop Out o deposito/prelievo LN Markets nella finestra di una modifica la rende «non valutabile». Modalità taker RoboSats, fase T0 in ombra: il libro registra il metodo di pagamento e i concorrenti delle nostre vendite sono solo le vendite «On-Chain BTC» a premio; la decisione swap calcola in ombra il miglior ordine di acquisto che potremmo prendere, quanto costerebbe e perché non parte (righe «Modalità taker (in ombra)» e «Lato acquisti» nelle statistiche); nessun ordine viene mai preso. Nuove chiavi, spente o prudenti: swap.takerMaxCostPpm 0, swap.takerAfterHours 48, swap.takerNeeds open,sale, swap.takerMaxBondPercent 4, swap.takerMinEscrowMinutes 60; il tetto si decide dopo almeno 14 giorni di dati.
