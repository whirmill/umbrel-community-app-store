port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.0 makes Telegram the owner's conversational interface, with immediate
  read-only coordination on slot 2, durable sessions and turn receipts, rich drafts,
  public reasoning summaries, explicit correction/new-request choices, native Stop,
  command menus and contextual actions. Financial coordination remains independent;
  the existing fee/rebalance mandate and partial profitability accounting are unchanged.
  CI 38027580133 passed 224 tests on Node 24.21.0 and 16 Python tests. Anonymous
  amd64/arm64 manifest/config and all 22 compressed layer SHA-256/size checks passed
  against source d915faa4b74408d9c1fb2db649d34af17d29ba08. Pi Durable remains 1.1.0;
  additive schema 6 preserves original jobs, conversations, submissions and receipts.
  Before installation stop the executor, checkpoint all three databases and preserve
  owner.secret, telegram.secret and mounted credentials with their permissions.
  Rollback requires compatible software and preservation of newer or uncertain receipts;
  never restore older databases over newer effects or replay payments/uncertain deliveries.
  Schema-5 software refuses schema 6. Already dispatched messages may finish after
  revocation. Installed streaming, correction and Stop acceptance remain separate.
