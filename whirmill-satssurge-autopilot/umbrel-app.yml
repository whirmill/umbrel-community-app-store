defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.17 continues the immutable original archive past large evidence
  records using bounded runtime batches, without skipping records or changing
  migration, retention or archive limits. Read-only agent diagnostics now include
  the persisted LND TLS status, certificate validity and independent inspection
  time; unknown transport evidence stays explicit. TLS verification and restricted
  credentials remain enforced. Telegram audio and voice messages receive an
  explicit unsupported reply; use text or phone-keyboard dictation. No audio
  decoder, transcription worker or model is installed.
  Native gRPC TLS collection, reconciliation and owner read-only tools require
  no host-helper bootstrap or host-attestation mount.
  App-control evidence remains unknown, and scoped mode keeps financial execution
  held independently of legacy interlock files. This packaging does not qualify
  other apps or owner-wide standalone automation. Restricted LND credentials,
  the original maintenance claim, mandate, budgets and reserve remain preserved.
  Schema 7 retains all 19 original legacy tables in immutable archives. Pi Durable,
  Pi AI and Chord remain 1.1.0; OAuth and original identifiers are preserved.
  The amd64/arm64 image index is immutable. Agent-generated HTML/DLS remains
  disabled pending M3 and separate rendering/Telegram attachment acceptance.
  Native parity, app-control observations, live web/Telegram acceptance and
  controlled legacy retirement remain separate roadmap gates.
