port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.44 reports the node's events in the chat: forwards and fees
  earned (one silent message per 15 minutes of activity), routing resuming,
  automatic rebalances and fee changes as they happen, payments received,
  channels opened, closed or inactive, on-chain deposits, app restarts and
  the mempool state. It adds channel plans: one proposal to approve that
  closes channels if needed and then opens several channels in a single
  transaction. Proposals stay valid for 30 minutes. Payment notices and
  batch opens need the updated provisioning scripts (see the README).
