releaseNotes: >-
  Revisione settimanale della strategia: una volta a settimana il modello legge in sola lettura le osservazioni della politica deterministica, le decisioni degli ultimi 30 giorni, le verifiche esterne e la configurazione, e ti manda un messaggio con le modifiche di configurazione che propone, ciascuna con il motivo; il codice scarta quelle fuori dai limiti e nulla viene applicato senza di te (satssurge strategy per i dettagli). Corretti la lettura di nomi di chiave anomali nel file di configurazione e il motivo d'attesa dei rifornimenti, che ora nomina anche il prezzo oltre il tetto.
