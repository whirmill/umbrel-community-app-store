releaseNotes: >-
  0.14.35: ammissione dalla politica. Un dato del kernel che manca per pochi minuti, come i prezzi giornalieri dei sink al cambio di giorno, non sveglia più due revisioni di fila. Diventa una novità da segnalare solo se dura almeno tre cadenze, come già il blip di sincronizzazione. Un dato mancante che c'era già prima del blip e torna non conta come nuovo. Una nuova azione ammissibile, una nuova bozza per il proprietario o un nuovo dato mancante di un predicato sono ancora segnalati subito. Il piano della politica deterministica ora riporta lo stato reale: fasi 1–5 attive, con il risultato della fase 0. Sulla copia dei dati di produzione le celle del kernel sono identiche alla 0.14.34. Nessuna impostazione, cella o schema cambia.
