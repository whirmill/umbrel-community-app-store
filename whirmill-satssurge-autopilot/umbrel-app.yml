dependencies: [lightning]
releaseNotes: >-
  Version 0.3.8 adds mandatory structured nonfinancial follow-up closure and
  truthful policy fallback without inferring waits from prose or widening
  financial authority. Model selection is synchronized between composer and
  Preferences, pinned per new admission; submitted/legacy recovery retains the
  original model. Default Sol/high and fixed high reasoning remain. Paginated
  legacy history, exact reading anchors, repo-native favicon and neutral themes
  preserve original receipts. Includes lazy Activity/Node details and mobile
  16px fields, 44px controls, safe areas and manual zoom. Preserves schema 4,
  subscription OAuth, mandate and financial executor. CI 37942146614 passed
  139 Node 24 and 16 Python tests. Anonymous amd64/arm64 configs and all 22
  layers passed SHA-256/size checks against source
  566dfcd4c295becef8a7d68b42e57bdde149e47d; package version is 0.3.8 and both
  commands use flock --no-fork. Installed qualification and natural economic
  closure readback remain pending. Local 24 responsive/model/history checks
  passed; native iOS and VoiceOver are unverified. No financial acceptance test,
  regtest, M3/M4 capability or profitability qualification is introduced.
