dependencies: [lightning]
releaseNotes: >-
  0.14.32: #317, i messaggi vocali funzionano anche quando Telegram è lento a preparare il file: il bot ora aspetta fino a 150 secondi la risposta di Telegram per il file (prima 35) e al massimo 3 minuti in tutto per scaricarlo, invece di rinunciare dopo un minuto e mezzo. Mentre scarica e trascrive un vocale il bot mette 👀 sul messaggio e mostra «sta scrivendo…», così si vede che ci sta lavorando; quando arriva la trascrizione o la risposta di errore la reazione sparisce. Nessun nuovo messaggio. Sulla copia dei dati di produzione tutti gli aggiornamenti Telegram, la coda di uscita e i lavori si leggono senza errori e le 29 celle del kernel sono identiche alla 0.14.31.
