defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Telegram: anteprime stabili che non saltano né si accorciano, nessun simbolo Markdown grezzo durante la scrittura, ultimo fotogramma anche per le risposte lunghe. Tabelle native di Telegram (intestazione, allineamento, formato compatto), link, citazioni ed elenchi annidati; risposte molto lunghe divise in più messaggi ordinati, con riserva al formato precedente se Telegram rifiuta.
