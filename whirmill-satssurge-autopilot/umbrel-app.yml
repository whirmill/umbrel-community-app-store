gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.4.0 replaces the custom input with official assistant-ui
  Composer.Root/Input/Send through one durable submission callback. Native
  Enter, Send and analysis each preserve a distinct request; dropped post-COMMIT
  acknowledgments recover the original nonce through the journal. Native input
  autosizes from one line and draft persists on tab return. Backend 0.3.9,
  model/effort selection, default Sol/high, original recovery, financial mandate,
  OAuth and schema 4 remain unchanged. CI 37952913853 passed 148 Node 24 and
  16 Python tests. Anonymous amd64/arm64 configs and all 22 layers passed
  SHA-256/size checks against source 50beed67ecfc9a3259173ff622bacea10ba0abfc;
  extracted package is 0.4.0 and both commands use flock --no-fork.
  Actual installed acceptance remains pending. Local native admission/ACK recovery,
  autosize 44/68/192px and 24 responsive cases passed with no overflow and empty
  console. Native iOS/VoiceOver and comparative heap savings are unverified.
  No financial acceptance test, regtest, M3/M4 capability or profitability
  qualification is introduced.
