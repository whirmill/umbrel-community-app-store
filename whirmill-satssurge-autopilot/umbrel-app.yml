releaseNotes: >-
  0.14.17: Controlli più severi sui dati letti da LND, da LN Markets e dalle ricevute salvate (#274, primo passo): l'esecutore e il modulo LN Markets ora verificano campo per campo importi, ricevute di pagamento dei depositi e fotografie dei canali al momento dell'invio, e se un dato è rotto si fermano con un errore chiaro invece di proseguire con un importo mancante o pari a zero; con dati normali nulla cambia (stesse ricevute, stati e testi), nessun pagamento parte su un dato non verificato. Testi delle formule del kernel con le regole dei numeri (#290): i controlli della politica, le attese e la decisione degli swap, il percorso di rifornimento, la capacità e la scala dei sink, la curva delle fee, Magma e la reputazione Amboss scrivono ora i numeri da quattro cifre con il punto delle migliaia (1.336 ppm, 9.000 sat) e le percentuali con una cifra decimale troncata e lo spazio prima di % (70 %, almeno 30 %, uptime 99,8 %); le decisioni non cambiano, cambiano solo le versioni delle celle (policy-decision pd-v4, swap-decision sw-v12, swap-route sr-v3). Un rifiuto che confronta due importi che arrotondati sembrerebbero uguali li scrive esatti al millisat ("19,999 sat sotto 20 sat (precisione al millisat)"); nella richiesta di Approva di un prelievo LN Markets, quando lo spazio per la fee è deciso dal minimo che LN Markets riserva, il testo lo dice; nella pagina Telegram del web gli importi del piano canali hanno il punto delle migliaia e un dato mancante si legge "Non disponibile". Dashboard: in Attività ci sono i filtri per stato (Tutte, Non completate, In corso, Completate); le attività non completate compaiono per prime con l'errore in italiano, mentre i dettagli restano chiusi. I blocchi operativi del server ora sono scritti in italiano. In Esperimenti ogni decisione mostra gli esiti come badge (prima valutazione, 7 e 30 giorni); le finestre di valutazione sono in una tabella e in un grafico del contributo osservato. In Proposte, per ogni tipo, vedi che cosa approvi: la fee da → a, importo e costo massimo del rebalance, i passi di un piano canali, aperture e chiusure, e i dettagli di Magma e LSPS1. Approva e Rifiuta non cambiano. In Panoramica la nuova card "Autonomia per funzione" mostra, per swap, Loop (chiesti da te e automatici), LN Markets, vendite Magma, LSPS1 e la scala delle commissioni, il gradino di oggi, le operazioni pulite e che cosa serve per salire. Dove il nodo non conta ancora le operazioni pulite, la card lo dice.
