releaseNotes: >-
  0.14.36: Valutatore delle aperture proposte dal codice: il verdetto resta valido anche quando Amboss rinnova soltanto la data dei suoi dati sul peer (stato, fonte e risposte delle ricerche contano ancora; una scadenza o un dato che diventa bloccante fanno chiedere di nuovo). Ora si ricordano gli ultimi due verdetti: se i dati di un candidato tornano a un valore già valutato nelle ultime 24 ore, si riusa quel verdetto invece di pagare una nuova richiesta. Dopo l'aggiornamento non c'è nessuna richiesta in più. Stima: da circa 20 a circa 13 richieste al giorno per le bozze di canale, circa 0,5–0,6 USD risparmiati al giorno. Sulla copia dei dati di produzione le 10 bozze con un verdetto recente vengono riusate al primo controllo dopo l'aggiornamento e le celle del kernel sono identiche alla 0.14.35. Nessuna impostazione, cella o schema cambia.
