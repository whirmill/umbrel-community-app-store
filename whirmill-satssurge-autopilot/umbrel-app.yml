manifestVersion: 1
id: whirmill-satssurge-autopilot
category: finance
name: SatsSurge Autopilot
version: "0.9.5"
tagline: An evidence-driven Lightning routing agent
description: >-
  Lightning routing agent for your LND node, driven from Telegram and using a
  ChatGPT/Codex subscription model. It analyses forwards, liquidity and fees,
  proposes and (when autonomy is resumed) executes bounded fee changes and
  circular rebalances, and keeps private SQLite accounting with durable intent
  tracking so no payment is ever repeated. Hard mandate: 30,000 sats total
  spend, 1,500 sats per day, 100 sats per attempt, and 500,000 confirmed
  on-chain sats always protected. Financial actions are dispatched only while
  other fee/rebalance automations (LightningMate, LNDg, Loop) are off. Requires
  one-time restricted LND credential provisioning and the host interlock timer;
  see the README.
developer: whirmill
website: https://github.com/whirmill/umbrel-community-app-store
repo: https://github.com/whirmill/satssurge-autopilot
support: https://github.com/whirmill/satssurge-autopilot/issues
port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.5 looks for peers to open channels with, in observation only:
  every 12 hours it reads the public graph around the peers of channels that
  run empty, and ranks their neighbours by the cost of bringing liquidity back
  through them. It needs the QueryRoutes permission on the channel credential
  (provision-channels.sh bakes it again); without it costs are estimated from
  announced fees. The database moves to schema 10: back up app-data before
  updating, 0.9.4 cannot open it. Fees, rebalances and other decisions are
  unchanged.
