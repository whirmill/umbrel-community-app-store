releaseNotes: >-
  0.14.31: #317, i file mandati su Telegram (messaggi vocali, immagini, documenti) vengono scaricati di nuovo dopo 1 e dopo 3 secondi se il primo tentativo non riesce, e se il download fallisce comunque la ricevuta indica il passo che non ha funzionato (risposta di Telegram, stato HTTP del file o errore di rete), senza token né indirizzi. I messaggi in italiano restano gli stessi. Corretto anche il pulsante Stop nativo di Telegram sulle risposte in scrittura: Telegram ne indica il riferimento come testo e da 16 novembre il bot lo scartava; ora lo Stop ferma di nuovo la risposta. Sulla copia dei dati di produzione tutti i 460 aggiornamenti Telegram si leggono senza errori (prima 450), la coda di uscita e i lavori si leggono come prima e le 29 celle del kernel sono identiche alla 0.14.30.
