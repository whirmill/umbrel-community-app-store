dependencies: [lightning]
releaseNotes: >-
  Version 0.3.5 adds immutable scoped evidence views with explicit completeness,
  persistent research/finalization budgets and hard provider limits, truthful
  analysis metadata and bounded nonfinancial review waits. Qualified public
  provider summaries and authenticated lazy details preserve private originals.
  GFM tables, grouped tools, virtual history and persistent System/light/dark
  themes improve the interface. Preserves schema 4, mandate, financial executor,
  OAuth and original operation receipts. CI 37929672372 passed 112 Node 24 and
  16 Python tests. Anonymous amd64/arm64 configurations and all 22 image layers
  passed SHA-256 and size checks against source
  13f43facfc061d22db2b1c878aab4c4f1bef7905; package version is 0.3.5 and both
  image commands use flock --no-fork. Installed 0.3.5 qualification is pending;
  0.3.4 remains the accepted installed release. Local heavy-fixture responsive,
  dark contrast and recovery checks passed. No financial acceptance test,
  regtest, M3/M4 capability or profitability qualification is introduced.
