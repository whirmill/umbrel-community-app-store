manifestVersion: 1
id: whirmill-satssurge-autopilot
category: finance
name: SatsSurge Autopilot
version: "0.9.6"
tagline: An evidence-driven Lightning routing agent
description: >-
  Lightning routing agent for your LND node, driven from Telegram and using a
  ChatGPT/Codex subscription model. It analyses forwards, liquidity and fees,
  proposes and (when autonomy is resumed) executes bounded fee changes and
  circular rebalances, and keeps private SQLite accounting with durable intent
  tracking so no payment is ever repeated. Hard mandate: 30,000 sats total
  spend, 1,500 sats per day, 100 sats per attempt, and 500,000 confirmed
  on-chain sats always protected. Financial actions are dispatched only while
  other fee/rebalance automations (LightningMate, LNDg, Loop) are off. Requires
  one-time restricted LND credential provisioning and the host interlock timer;
  see the README.
developer: whirmill
website: https://github.com/whirmill/umbrel-community-app-store
