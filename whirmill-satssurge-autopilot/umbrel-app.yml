dependencies: [lightning]
releaseNotes: >-
  0.14.20: #274, settima parte: il mandato e le proposte del proprietario leggono i dati in modo tipizzato. Prima di prenotare una spesa, SatsSurge controlla la decisione, le prenotazioni attive, le spese del giorno e del mese, i tentativi precedenti sullo stesso corridoio e il collegamento alla chiamata dello strumento. Un importo o un identificativo illeggibile ferma l'operazione con un errore che nomina il campo (mai il valore), senza scrivere nulla a metà. Una proposta con un contenuto illeggibile si vede ancora nell'elenco, ma non si può approvare: viene invalidata prima di qualsiasi verifica in rete o esecuzione. Con dati validi non cambia niente: stessi importi, stessi testi, stesse regole del mandato.
