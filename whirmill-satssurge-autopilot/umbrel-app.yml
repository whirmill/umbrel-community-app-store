releaseNotes: >-
  0.14.30: messaggi vocali del proprietario. Con telegram.voiceTranscribe a 1 (di serie 0, quindi per ora non cambia nulla) un messaggio vocale o un file audio mandato nella chat collegata viene trascritto con OpenRouter, usando la chiave già presente in config/openrouter.key e il modello scelto in telegram.voiceModel (di serie google/gemini-3.5-flash-lite). La trascrizione torna in chat come «📝 …» in risposta al vocale e arriva all'assistente esattamente come un messaggio scritto, con una nota che gli chiede di confermare dati o importi poco chiari. Un vocale non diventa mai un comando, un pulsante o un'approvazione. Limiti: durata massima 5 minuti (telegram.voiceMaxSeconds), 300 minuti al mese (telegram.voiceMonthlyMinutes), 20 MB e il tetto mensile del costo dei modelli; se un limite non è rispettato il bot risponde «Messaggio vocale non trascritto: …» e non passa nulla all'assistente. Il costo di ogni trascrizione entra nel costo dei modelli del mese; audio e testo non vengono salvati nei registri. Sulla copia dei dati di produzione la configurazione si legge senza errori, i messaggi Telegram, la coda di uscita e i lavori si leggono come prima e le 29 celle del kernel sono identiche alla 0.14.29.
