defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.6 lets analyses reach a decision again: since 26 October they
  had to read more evidence than their budget allowed and never computed the
  forecast. They now read the sections a decision rests on, and payments
  turned away for insufficient balance count as demand toward the evidence
  threshold. Peer candidates must beat today's return route. Telegram
  commands are in English: /chart replaces /grafico (still understood).
