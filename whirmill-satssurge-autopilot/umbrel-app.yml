dependencies: [lightning]
releaseNotes: >-
  0.14.4: Loop Out: il budget del mese ora conta solo quello che è successo davvero. I tentativi falliti o abbandonati non pesano più sul volume; il costo è quello effettivamente pagato, con il token L402 contato una sola volta. La ricevuta di un tentativo che ha pagato solo il token lo dice ("fallito, pagato solo il token L402 di 200 sat") invece di "nulla pagato". Il prepagamento risulta "trattenuto" solo quando LND lo conferma a una lettura successiva, e il pagamento dello swap parte solo dopo: un minuto più tardi, ma senza pagare lo swap se il prepagamento non è arrivato.
