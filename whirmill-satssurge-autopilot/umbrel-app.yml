port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.5.13 adds bounded native gRPC history and stream collection,
  provenance, explicit coverage gaps and unified read-only consumers. Schema 7
  preserves all 19 original legacy tables in immutable archives before migration;
  research continuation survives refresh and reopening. Native protected-control
  checks preserve suspension when evidence is unknown. Pi Durable, Pi AI and
  Chord remain 1.1.0; OAuth, original identifiers and financial receipts remain
  preserved. The release uses an immutable amd64/arm64 image index. Live migration,
  semantic parity, protected-control and web/Telegram acceptance are separate
  qualification steps; coverage remains partial. Autonomy stays suspended under
  the existing maintenance claim, mandate, budgets and reserve. M3 completion,
  agent-generated HTML/DLS exports and optional integrations remain pending.
