defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.9.30 lets you send a photo or screenshot to the bot (JPEG, PNG or
  WebP up to 5 MB) with your question in the caption; the agent reads the image
  in the same answer. Budget and mandate limits are unchanged.
