releaseNotes: >-
  0.14.28: #253, modalità taker RoboSats fase T1, spenta: il proprietario può prendere un ordine pubblico di acquisto con "/swap take <sat al massimo> [<id canale>]" su Telegram o "satssurge swap take" dalla console, solo quando swap.takerMaxCostPpm è sopra 0. Di serie è 0: il comando risponde come oggi e non viene preso nessun ordine. Con l'interruttore acceso la presa passa sempre dall'Approva su Telegram (swap.takerApproval solo owner, finestra swap.takerApprovalMinutes 15 minuti), che indica l'ordine, il costo e il limite approvato; poi l'ordine viene riletto, preso una sola volta, controllato prima di pagare la cauzione e seguito come uno swap-out normale dalla garanzia in poi. Le statistiche dei nostri ordini (memoria dei prezzi, tempi di presa) non contano le prese, e per questo le celle swap cambiano versione; con i dati di oggi le uscite restano identiche. #274: corretti gli ultimi avvisi del controllo del codice fuori dai test dove il risultato resta provatamente identico (da 164 a 102 eccezioni, nessuna aggiunta). Sulla copia dei dati di produzione ogni ordine swap si legge senza errori, la configurazione del nodo prende i valori di serie e le uscite e le 29 celle del kernel sono identiche alla 0.14.27, salvo il numero di versione delle celle swap.
