releaseNotes: >-
  0.14.27: #274, ultimo blocco della tipizzazione: ora tutti i moduli del programma (test esclusi) leggono i dati con decodificatori tipizzati. Sono tipizzati il pagamento a un indirizzo Lightning (l'importo resta controllato in modo rigoroso), la configurazione (stesso risultato su ogni file valido), le credenziali (un errore non può più citare parte di una chiave salvata), gli esiti dei lavori, le attese di revisione, l'ammissione automatica, il programmatore, i modelli e il loro costo, e poi grafici, spazio del database, controlli Amboss e Umbrel, brief, grafo e capacità verso i pozzi. Il riepilogo mensile del costo dei modelli, da cui dipende il tetto di spesa, è rigoroso: un giorno di costo danneggiato ferma il lavoro automatico a pagamento e lo dice con il nome del campo, invece di sommare valori sbagliati e lasciar passare il tetto. Le statistiche informative (richieste ai modelli, ammissioni, telemetria del valutatore, rifiuti, proposte canali) saltano e contano un record illeggibile. Lo sfoltimento delle fotografie dei canali conta le operazioni sui canali illeggibili che incontra (decisione invariata) e lo mostra in "satssurge storage" e nella scheda Spazio del database solo se ce ne sono. Con dati validi non cambia nulla: sulla copia dei dati di produzione ogni record si legge senza errori e le uscite, il costo dei modelli e le 29 celle del kernel sono identici alla 0.14.26.
