releaseNotes: >-
  Version 0.3.1 fixes chat request IDs on the installed Umbrel HTTP origin by
  using cryptographically secure getRandomValues IDs where randomUUID is
  unavailable. Improves follow-latest scrolling and navigation in the M2.1
  responsive React interface. Retains authenticated streaming, durable history
  replay, safe Markdown, Pi Durable, subscription OAuth, the guarded executor
  and existing financial limits. CI passed 70 Node and 15 Python tests.
  Immutable amd64/arm64 images identify source
  719c20be7916440b2a9b6b8b565e9081a6c7e0f2; both platforms and all image layers
  passed anonymous registry download and digest verification.
  Installed on Umbrel and owner-browser acceptance verified, including real Pi
  streaming, concurrent jobs, restart/history recovery and restored autonomy.
  No channel lifecycle, Magma, Telegram or profitability qualification.
