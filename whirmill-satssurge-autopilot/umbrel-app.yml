port: 5238
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-satssurge-autopilot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: [lightning]
releaseNotes: >-
  Version 0.6.0 simplifies how the agent runs on Pi Durable. The app no longer
  patches the Durable library, its tools are defined once per permission, and
  failed model requests are retried by Durable itself. After a restart,
  interrupted agent runs resume only when they would be allowed to start now;
  otherwise they are closed and never repeated. Each financial operation now
  records the agent step that started it.
