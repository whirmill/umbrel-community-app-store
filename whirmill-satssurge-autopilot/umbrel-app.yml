releaseNotes: >-
  0.14.21: Test di layout con Playwright (#290 F13): `npm run test:layout` controlla l'app reale, su dati di prova temporanei e senza rete, a 375, 768 e 1280 px, nei temi chiaro e scuro. Verifica che nessuna pagina scorra di lato, che nulla resti tagliato o sovrapposto, che la navigazione raggiunga ogni pagina e che il selettore del periodo funzioni anche da tastiera. Playwright resta fuori dall'immagine di produzione e da `npm test`; il browser si installa solo con `npm run test:layout:install`. I test hanno trovato un difetto, già corretto: a 768 px la cifra principale di Contabilità era tagliata ("+10.913 sa"); ora tra 768 e 1279 px occupa una riga intera, come in Panoramica. Il generatore dei dati sintetici del benchmark ora produce record che le statistiche sanno leggere.
