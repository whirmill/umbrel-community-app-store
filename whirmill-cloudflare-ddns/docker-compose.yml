version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: whirmill-cloudflare-ddns_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/whirmill/umbrel-cloudflare-ddns:1.1.2@sha256:6d9d5b1f8a91f40417e6ea32f2cab9dbe1f657b93ce05814c7384a9c712f5e27
    restart: on-failure
    init: true
    user: "1000:1000"
    command: ["python", "/app/cloudflare_ddns.py"]
    environment:
      DATA_DIR: /data
      WEB_DIR: /web
      HOST: 0.0.0.0
      PORT: "8080"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
