manifestVersion: 1
id: whirmill-cloudflare-ddns
category: networking
name: Cloudflare DDNS
version: "1.1.1"
tagline: Keep selected DNS records on your public IPv4
description: >-
  Detects the current public IPv4 over HTTPS and periodically updates an
  explicit allowlist of existing Cloudflare A records across multiple zones. A
  restricted API token is installed over SSH instead of crossing the local HTTP
  UI; the app never returns it and preserves each managed record's existing
  Cloudflare proxy or DNS-only state while updating its public IPv4 address.
developer: whirmill
website: https://developers.cloudflare.com/dns/manage-dns-records/how-to/managing-dynamic-ip-addresses/
repo: https://github.com/whirmill/umbrel-community-app-store
support: https://developers.cloudflare.com/api/
port: 5233
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-cloudflare-ddns/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Fixes app updates by packaging the backend and UI in a versioned container
  image. Multi-zone settings now reach the installed runtime, while the existing
  token and configuration remain persistent. Single-zone settings still migrate
  automatically.
