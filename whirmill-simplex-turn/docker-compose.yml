version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: whirmill-simplex-turn_status_1
      APP_PORT: 80

  server:
    image: coturn/coturn:4.16.0-r0@sha256:01fc8655e7c262fa4ccfb8dca74ff80fb372b0ee021e80370a4d3e3dd01a951e
    restart: on-failure
    init: true
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        umask 077
        external_ip="$$(detect-external-ip)"
        internal_ip="$$(hostname -i | awk '{print $$1}')"
        case "$$external_ip" in
          *.*.*.*) ;;
          *) printf 'Unable to detect public IPv4.\n' >&2; exit 1 ;;
        esac
        case "$$internal_ip" in
          *.*.*.*) ;;
          *) printf 'Unable to detect container IPv4.\n' >&2; exit 1 ;;
        esac
        config=/tmp/turnserver.conf
        {
          printf '%s\n' \
            'listening-port=3478' \
            'listening-ip=0.0.0.0' \
            "relay-ip=$$internal_ip" \
            "external-ip=$$external_ip/$$internal_ip" \
            'relay-threads=1' \
            'min-port=49160' \
            'max-port=49179' \
            'fingerprint' \
            'lt-cred-mech' \
            'realm=turn.satssurge.com' \
            "user=simplex:$$TURN_PASSWORD" \
            'stale-nonce=600' \
            'unauthorized-ratelimit' \
            'unauthorized-ratelimit-rps=5' \
            'log-binding' \
            'no-tcp-relay' \
            'no-multicast-peers' \
            'no-tls' \
            'no-dtls' \
            'no-software-attribute' \
            'no-rfc5780' \
            'denied-peer-ip=0.0.0.0-0.255.255.255' \
            'denied-peer-ip=10.0.0.0-10.255.255.255' \
            'denied-peer-ip=100.64.0.0-100.127.255.255' \
            'denied-peer-ip=127.0.0.0-127.255.255.255' \
            'denied-peer-ip=169.254.0.0-169.254.255.255' \
            'denied-peer-ip=172.16.0.0-172.31.255.255' \
            'denied-peer-ip=192.168.0.0-192.168.255.255' \
            'user-quota=12' \
            'total-quota=16' \
            'max-allocate-timeout=10' \
            'max-allocate-lifetime=600' \
            'max-bps=625000' \
            'bps-capacity=2500000' \
            'log-file=stdout' \
            'simple-log' \
            'new-log-timestamp' \
            'pidfile=/tmp/turnserver.pid' > "$$config"
        }
        watch_external_ip() {
          candidate_ip=
          candidate_count=0
          while sleep 60; do
            detected_ip="$$(timeout 10 detect-external-ip 2>/dev/null || true)"
            case "$$detected_ip" in
              *.*.*.*) ;;
              *) continue ;;
            esac

            if [ "$$detected_ip" = "$$external_ip" ]; then
              candidate_ip=
              candidate_count=0
              continue
            fi

            if [ "$$detected_ip" = "$$candidate_ip" ]; then
              candidate_count=$$((candidate_count + 1))
            else
              candidate_ip="$$detected_ip"
              candidate_count=1
            fi

            if [ "$$candidate_count" -ge 2 ]; then
              printf 'Public IPv4 changed from %s to %s; restarting Coturn.\n' \
                "$$external_ip" "$$detected_ip"
              return 75
            fi
          done
        }

        stop_children() {
          trap - TERM INT
          kill "$$watchdog_pid" 2>/dev/null || true
          kill -TERM "$$turn_pid" 2>/dev/null || true
          wait "$$watchdog_pid" 2>/dev/null || true
          wait "$$turn_pid" 2>/dev/null || true
          exit 0
        }

        turnserver -c "$$config" &
        turn_pid=$$!
        watch_external_ip &
        watchdog_pid=$$!
        trap stop_children TERM INT

        while kill -0 "$$turn_pid" 2>/dev/null && \
          kill -0 "$$watchdog_pid" 2>/dev/null; do
          sleep 1
        done

        if kill -0 "$$turn_pid" 2>/dev/null; then
          set +e
          wait "$$watchdog_pid"
          child_status=$$?
          set -e
          kill -TERM "$$turn_pid" 2>/dev/null || true
          wait "$$turn_pid" 2>/dev/null || true
        else
          set +e
          wait "$$turn_pid"
          child_status=$$?
          set -e
          kill "$$watchdog_pid" 2>/dev/null || true
          wait "$$watchdog_pid" 2>/dev/null || true
        fi

        if [ "$$child_status" -eq 0 ]; then
          child_status=1
        fi
        exit "$$child_status"
    environment:
      TURN_PASSWORD: $APP_PASSWORD
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49179:49160-49179/udp"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/coturn
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && timeout 2 bash -ec '</dev/tcp/127.0.0.1/3478'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  status:
    image: nginx:1.29.6-alpine@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
      TURN_HOST: turn.satssurge.com
      TURN_PORT: "3478"
      TURN_USERNAME: simplex
      TURN_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/status/templates:/etc/nginx/templates:ro
      - ${APP_DATA_DIR}/status/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/status/app.js:/usr/share/nginx/html/app.js:ro
      - ${APP_DATA_DIR}/status/styles.css:/usr/share/nginx/html/styles.css:ro
    read_only: true
    tmpfs:
      - /usr/share/nginx/html
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
