manifestVersion: 1
id: whirmill-simplex-turn
category: networking
name: SimpleX TURN Relay
version: "4.18.0"
tagline: Private WebRTC media relay
description: >-
  Runs a STUN and authenticated TURN WebRTC relay on Umbrel for SimpleX audio
  and video calls. The relay uses turn.satssurge.com, a narrow UDP relay range,
  resource quotas, private-network peer blocking, and an app-specific secret.
