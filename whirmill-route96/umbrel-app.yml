manifestVersion: 1
id: whirmill-route96
category: social
name: Route96 Community
version: "0.7.0-3429578"
tagline: Current Route96 build with upstream security fixes
description: >-
  Route96 is a self-hosted Blossom and NIP-96 media server for Nostr. This
  community package pins the verified upstream main-branch image built from
  commit 3429578, retaining the July 2026 security, standards-compliance,
  range-request, and setup fixes that are newer than the v0.7.0 release image.


  The service stores uploads and its MariaDB database persistently on Umbrel.
  Its HTTP API intentionally remains directly reachable by Nostr clients on
  the local or private network; Umbrel account authentication is not added to
  protocol requests.
