name: SatsSurge host installers
on:
  pull_request:
    paths: ["whirmill-satssurge-autopilot/scripts/**", ".github/workflows/satssurge-host-scripts.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Host script tests
        run: python3 -m unittest discover -s whirmill-satssurge-autopilot/scripts/tests -v
      - name: ShellCheck installers
        run: shellcheck whirmill-satssurge-autopilot/scripts/*.sh
