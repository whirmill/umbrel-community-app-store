name: ZapBot package tests

on:
  pull_request:
    paths:
      - 'whirmill-zapbot/**'
      - 'tests/zapbot-*'
      - 'tests/test_zapbot_postgres_startup_assess.py'
      - '.github/workflows/zapbot-package-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-startup-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic and assessment logic
        run: |
          sh -n tests/zapbot-postgres-startup-diagnostic.sh
          python3 -m unittest discover -s tests -p 'test_zapbot_postgres_startup_assess.py'
      - name: Probe empty PostgreSQL data on a bind mount
        id: bind
        run: sh tests/zapbot-postgres-startup-diagnostic.sh "$RUNNER_TEMP/zapbot-pg-bind" bind
      - name: Probe empty PostgreSQL data on a named volume
        if: ${{ !cancelled() && steps.bind.outcome != 'skipped' }}
        run: sh tests/zapbot-postgres-startup-diagnostic.sh "$RUNNER_TEMP/zapbot-pg-named" named
      - name: Preserve startup diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapbot-postgres-startup-diagnostic
          path: |
            ${{ runner.temp }}/zapbot-pg-bind/
            ${{ runner.temp }}/zapbot-pg-named/
          if-no-files-found: ignore

  export-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: sh -n whirmill-zapbot/scripts/export-release-sql.sh tests/zapbot-release-sql.sh tests/zapbot-bootstrap-export-order.sh
      - name: Verify SQL export and failure handling
        run: sh tests/zapbot-release-sql.sh
      - name: Verify initialization order with absent data directory and repeat
        run: sh tests/zapbot-bootstrap-export-order.sh
      - name: Verify immutable image through fresh, restore and restart package lifecycles
        env:
          ZAPBOT_PACKAGE_TEST_RESTORE_224: "1"
        run: |
          ZAPBOT_PACKAGE_IMAGE="$(yq e '.services.migrate.image' whirmill-zapbot/docker-compose.yml)" \
          ZAPBOT_PACKAGE_LIFECYCLE_RECEIPT="$RUNNER_TEMP/zapbot-package-lifecycle.log" \
            sh tests/zapbot-package-lifecycle.sh
      - name: Preserve package lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapbot-package-lifecycle
          path: ${{ runner.temp }}/zapbot-package-lifecycle.log
          if-no-files-found: ignore
