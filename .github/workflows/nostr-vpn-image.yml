name: Build Nostr VPN Umbrel image

on:
  push:
    tags:
      - "nostr-vpn-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: nostr-vpn-image-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: mmalmi/nostr-vpn
  UPSTREAM_COMMIT: 4320001ec84eeec7a32d54419569f63012c81c8d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#nostr-vpn-v}"
          if [[ "$version" != "4.1.6" ]]; then
            echo "Unsupported Nostr VPN release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the exact upstream release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Verify upstream release identity
        shell: bash
        run: |
          actual_commit="$(git -C upstream rev-parse HEAD)"
          test "$actual_commit" = "$UPSTREAM_COMMIT"
          test "$(git -C upstream describe --tags --exact-match HEAD)" = "v${{ steps.version.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Umbrel image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./upstream
          file: ./upstream/umbrel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/whirmill/nostr-vpn-umbrel:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_COMMIT }}
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nostr-vpn-umbrel
          cache-to: type=gha,mode=max,scope=nostr-vpn-umbrel

      - name: Record immutable image digest
        shell: bash
        run: |
          {
            echo "### Nostr VPN Umbrel image"
            echo '```text'
            echo "ghcr.io/whirmill/nostr-vpn-umbrel:v${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Upstream commit: $UPSTREAM_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
