releaseNotes: >-
  Schema-233 query-flow release: it adds two concurrent, self-healing causal
  event lookup indexes and guarded trusted-v2 series predicate rewriting. It
  makes settings, Monitor reconciliation, and operator diagnostics more
  predictable under concurrent updates while preserving bounded work. All
  ZapBot services and Trusted V2 attestation use source revision `61bd1305b2f6801d4901f481e7a07985015a346d` pinned
  to immutable image index `sha256:31ebfd865b5f5e22093696370c100bc7357fcff352d1ba503f7bbe9700a68091`. No global deadline, cache TTL, pool,
  risk, authority, or activation change is included. OPS009 installation and
  normal-browser qualification remain open.
