releaseNotes: >-
  Adds the default-off, evidence-only learning.pipeline@v1 flow from causal
  deliberation events through immutable snapshots, robust normalization,
  exact-L2 vectors and exact-horizon labels, with bounded recovery, status and
  bootstrap controls. The Deliberation page now includes an interactive,
  accessible lineage graph. Trading, sizing, exposure, leverage and risk
  controls are unchanged; the learning pipeline generates no live actions.
