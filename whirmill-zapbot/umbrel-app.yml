port: 5237
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-zapbot/icon.png
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Moves operator diagnostics from the retired public hostname to Umbrel, adds
  separate private token-file support for read and control access, registers the
  bounded decision.engine.posture receipt as a read-only RPC, and removes a
  compiler warning from flat-cache provenance without changing its fail-closed
  behavior. Entry mode, execution, sizing, exposure, leverage and risk controls
  are unchanged; Alpha remains default-off, unbound and without live influence.
