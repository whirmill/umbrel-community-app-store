releaseNotes: >-
  Reduces repeated execution-outcome reads and the work needed to inspect
  historical Oban queues, preserving complete results and backlog checks.
  Local equivalence and performance tests passed; installed Monitor timing
  still requires verification. Schema 233 is unchanged. All ZapBot services
  and Trusted V2 attestation use source revision `30470c8e300b301b2ae2dd29cffd227b549d27fc`
  pinned to immutable image index `sha256:2a1b41c1c8b9b05a0e267a67fb51a6a7a2b1502e50c6dada4400b7acf6d18227`.
  No timing budget, cache TTL, pool, risk, authority, or activation change is
  included. This release does not enable trading or close OPS009 by itself.
