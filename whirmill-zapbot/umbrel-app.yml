releaseNotes: >-
  Removes unused 24-hour aggregates and pagination from the live operational
  signals path while preserving the exact fail-closed alert contract. This gives
  concurrent Monitor and scheduled workloads more latency margin without raising
  timeouts or pool size. Trusted V2 candle-boundary stability, parallel execution,
  runtime settings, trading and risk controls remain unchanged.
