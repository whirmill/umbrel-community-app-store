gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Makes execution preflight prefer the canonical continuous-exposure evidence
  emitted by GraphRuntime while retaining the legacy-key fallback. Structured
  Trusted V2 provider failures are now classified before transaction entry and
  exposed only through a fixed, sanitized diagnostic code. No database migration,
  persisted setting, sizing, leverage, drawdown or other risk limit is changed.
