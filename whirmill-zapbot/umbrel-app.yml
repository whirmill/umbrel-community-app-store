releaseNotes: >-
  Version 0.1.85 corrects Oban queue-drain measurements to use due work.
  Future scheduled jobs retain their state counts but contribute no negative
  queue age or due backlog. Unknown timestamp or query evidence remains unknown;
  an observed due-work breach remains visible. Full state and historical failure
  counts remain separate from due workload. Generic freshness, cache TTL,
  deadlines, H4 boundaries and trading authority are unchanged.
  Source PR635 merged b65c67bb17c57f571687b2ba9650e3659c6db2fb after independent
  CLEAN review and full exact CI37462848175 plus automatic CI37462827014.
  Separate disposable PG18 focused tests and a paired 1.2-million-row benchmark
  support the correction; they do not close live Monitor SLOs or OPS009 timeout.
  Native amd64/arm64 image run37464508847 and independent registry OCI, SLSAv1
  and SPDX checks verify the same source. All twelve application pins, attestor
  digest and current rollback image use the immutable verified index.
  Schema243 through20261006020000 and fixtures are unchanged. Exact new-image
  Linux lifecycle and final package review remain required before publication
  or managed installation. OPS-010 real fresh empty-PGDATA startup remains
  unqualified. No canary, activation, risk or credential-setting change is included.
