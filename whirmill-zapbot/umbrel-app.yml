releaseNotes: >-
  First no-schema query-flow wave: P1 settings and runtime-SLO query-path
  cleanup; P2 Monitor query-flow stabilization; F05 bounded reconcile polling
  with per-account concurrency serialization and batched freshness updates; and
  Q12/Q13 query-path improvements. All ZapBot services pin the same immutable
  multi-architecture image for source revision
  38ffc1b04f4de9894205424435a8251ac7818fb8. No schema, global deadline,
  cache TTL, pool, risk, authority, or activation change is included.
  OPS009 remains under installation and normal-browser qualification; F07,
  F09, F10, and F11 remain separate candidates under P9.
