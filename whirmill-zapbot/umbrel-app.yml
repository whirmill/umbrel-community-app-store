releaseNotes: >-
  Completes the data-integrity hardening with durable observe decision records
  and fail-closed close-to-outcome learning delivery. Historical Entry Burst
  evidence expires without deletion; analytics, provenance, mode diagnostics,
  frontend data states, responsive behavior and accessibility remain truthful.
  The image is pinned to its native amd64/arm64 immutable digest; runtime
  settings, trading and risk controls, and producer admission remain unchanged.
