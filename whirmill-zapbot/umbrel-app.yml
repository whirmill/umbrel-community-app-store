releaseNotes: >-
  Applies the optimized SQL execution boundary across API, Hub, workers,
  release checks and UI-backed reads. Stable statements gain reusable versioned
  identities, dynamic SQL remains explicitly unnamed, and set-based evidence,
  causal-comparison and feature-backfill queries avoid repeated work. Operator
  Posture now preserves its last complete snapshot through partial refreshes.
  Runtime settings, trading and risk controls, and producer admission remain
  unchanged.
