icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-zapbot/icon.png
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Makes strict live readiness use canonical continuous exposure across filled
  and pending venue state, in-flight commands and reservations. Flat state is
  authoritative only with fresh trade-cache and REST-reconcile evidence;
  unavailable, stale or malformed evidence remains fail-closed. The reviewed
  3-active/1-decision-sleeve profile, exposure cap 1.0, 300-sat aggregate
  stop-risk budget and disabled five-lot capability are unchanged.
