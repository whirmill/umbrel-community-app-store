tagline: Restart-safe ZapBot runtime with public market data
description: >-
  A restart-safe ZapBot package. It restores and migrates a local PostgreSQL
  data directory, requires manage-only readiness before admission, and starts
  the public LN Markets feed while keeping deliberation, execution consumers,
  and standalone data producers disabled until separately reviewed cutovers.
