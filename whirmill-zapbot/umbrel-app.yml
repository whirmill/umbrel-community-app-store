releaseNotes: >-
  Makes Operator Posture source order explicit and records sanitized lifecycle
  receipts for incomplete sources. Nested failures and deadline expiry propagate
  honestly instead of appearing successful, while the semantic live region no
  longer clips the visible alert. No live activation occurs. H4 economics
  acquisition stays bounded to 20 seconds and H4 CLI keeps a 30-second HTTP
  receive timeout; neither guarantees completion. Schema remains 230 through
  20260910100000; manage_only, disabled H4 admission, and verified 0.1.46
  compatibility rollback remain. OPS002 transport remains open and runtime
  performance qualification is still required.
