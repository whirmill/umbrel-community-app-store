defaultPassword: ""
dependencies: []
releaseNotes: >-
  Reuses request-local Operator Posture inputs while retaining existing deadlines
  and incomplete-source receipts. No collection completion is guaranteed and no
  activation, schema, resource, or authority setting changes. H4 economics stays
  bounded to 20 seconds and H4 CLI keeps a 30-second receive timeout. OPS002
  transport remains open.
