releaseNotes: >-
  Adds a fixture-only assessment of signed active-funding evidence, with exact
  observed margin, fee and funding components and conservative command overlap
  diagnostics. It grants no admission or available-capital authority and enables
  no trading, acquisition or scheduler. Schema 238 and the five-consumer DNS
  correction are retained. Fresh empty-PGDATA installation remains blocked by
  OPS-010.
