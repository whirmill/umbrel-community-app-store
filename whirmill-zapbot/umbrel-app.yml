releaseNotes: >-
  Keeps Operator Posture within its five-second server budget through pool-safe,
  bounded evidence collection. Entry Burst now proves that the capped command
  scan covers the complete current cluster and expiry horizon, so older
  historical evidence remains auditable without degrading current posture;
  incomplete recent coverage still fails closed. Runtime settings, trading and
  risk controls, and producer admission remain unchanged.
