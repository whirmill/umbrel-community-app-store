releaseNotes: >-
  Adds scoped, redacted account-identity diagnostics to the existing readiness
  exposure read. It changes no readiness query, TTL, gate or schedule, and does
  not change risk, ownership, activation or trading behavior. The full 3,020
  source tests and SPA checks passed; schema 233 is unchanged. All ZapBot
  services and Trusted V2 attestation use source revision
  `91363ae70c92bba1c0990ccfb8ab25210d0d6e37` pinned to immutable image index
  `sha256:9c3a7a45066d522f6f7043282adeb656d7e23e7f4c5044362b4639a1baf30a85`.
  This does not guarantee every restart outcome, close the Monitor SLO, or
  enable activation.
