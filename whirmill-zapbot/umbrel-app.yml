releaseNotes: >-
  Publishes the automatic evidence-only learning pipeline and interactive
  deliberation lineage graph with a least-privilege migration repair for
  schema-qualified immutable trigger functions. Fresh installs and databases
  that already recorded the original migration converge on the same safe
  trigger posture. Trading, sizing, exposure, leverage and risk controls are
  unchanged; the learning pipeline generates no live actions.
