releaseNotes: >-
  Fixes exposure-reservation accounting and expiry locking. Consumed reservations
  continue to count after their original TTL; only unconsumed active reservations
  expire by time. Expiry acquires scope locks before row locks and rechecks state
  after waiting, preserving concurrent claims. Canonical-command deduplication
  remains in place. This is a prerequisite correction for H4 admission, not its
  activation. Risk limits, entry mode, startup protections and producer gates are
  unchanged. Every service and attestor are pinned to source revision `d388db41e99685b8031c484fa0b92e5f77310196`
  and immutable multi-architecture index `sha256:e824f56c1dffc181e7294c1c02691b023de46db1c522594275795498601eb283`. Schema 233 is unchanged;
  the fenced 0.1.46 compatibility rollback is retained.
