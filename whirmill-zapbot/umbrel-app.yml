releaseNotes: >-
  Schema-235 package qualification passed against the published immutable
  multi-architecture source image. This release adds an isolated LN Markets
  account-reconciliation snapshot
  contract: `authority=none`, `admission_eligible=false`, reconciliation=false,
  and liabilities unknown. Its dedicated producer role is NOLOGIN by default;
  it has no scheduler, RPC, live binding, current-producer activation, or private
  signing-key access. The two SECDEF body hashes, immutable trigger names, and
  role/ACL contract are pinned. Fresh, repeat, schema-229 upgrade, actual
  schema-224 restore, ownerless schema-235 restore, tamper rejection, and fenced
  0.1.46 compatibility rollback lifecycles passed against the pinned image. Store
  review and Git publication remain required before installation. The fenced 0.1.46
  compatibility rollback retains the schema-235 verifier.
