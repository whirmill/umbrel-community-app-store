releaseNotes: >-
  The schema-236 immutable source image is published and the local default
  lifecycle passed. An existing-data Umbrel update requires full Linux
  restore-224 CI and final security review before merge. Two local full
  restore-224 attempts hit existing OPS-010. Fresh empty-PGDATA installation is
  BLOCKED: temporary PostgreSQL init ownership failures recur, while UID 0/999
  transition safety and root cause remain unproven. This package adds the
  source-owned `lnmarkets_account_active_snapshot_raw_evidence@v1` companion to
  the already signed account-snapshot parent. Its cryptographic canonical text is
  replayable; JSONB fields are non-authoritative projections. The companion is
  immutable, parent-bound, `authority=none`, `admission_eligible=false`, and
  reconciliation=false. It keeps the existing dedicated producer role NOLOGIN,
  with no generated credential, runtime grant, scheduler, RPC, live binding,
  current-producer activation, or private signing-key access. The raw-row helper
  and two trigger-function body hashes, trigger wiring, and exact ACL contract
  are pinned. The local default lifecycle passed the compatibility rollback
  contract; it makes no fresh-install, deployment, activation, or backup
  qualification claim.
