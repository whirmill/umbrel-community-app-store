name: ZapBot
version: "0.1.4"
tagline: Observation warmup with persisted market data
description: >-
  A restart-safe ZapBot package. It restores and migrates a local PostgreSQL
  data directory, requires manage-only readiness before admission, and starts
  the public LN Markets feed plus internal observation consumers while keeping
  live deliberation execution, new entries, and standalone data producers
  disabled until separately reviewed cutovers.
