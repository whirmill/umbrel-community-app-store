releaseNotes: >-
  Keeps the global optimized SQL boundary and moves the bounded Operator
  Posture collector to the summary dashboard profile. The
  profile retains all graph, Oban and notification queues plus dispatch,
  queue-drain, reconciliation and notification SLO gates, while omitting
  unrelated full-page enrichment reads. Runtime settings, trading and risk
  controls, and producer admission remain unchanged.
