releaseNotes: >-
  Adds dormant owner-only prepared-intent fixture contexts and immutable
  original-envelope storage at schema 239. Six SECURITY INVOKER helpers add
  no runtime caller, role, credential, activation, venue dispatch, admission
  or risk change. Source review, PostgreSQL 18 fresh/224-upgrade/ownerless
  restore CI and both native image architectures passed for source cb39214d.
  Exact-image Linux package qualification including restore-224 and
  schema-preserving rollback plus final review remain required before merge
  or installation. Fresh empty-PGDATA installation remains blocked by OPS-010.
