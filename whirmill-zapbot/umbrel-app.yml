releaseNotes: >-
  Version 0.1.83 closes generic H4 authority bypasses before command or
  reservation effects, including conflicting declarations and mirror replay.
  H4 remains default OFF. Dedicated positive atomic policy admission,
  reservation, VENUE consumption and mandatory transport remain unavailable;
  no live enrollment, activation, provider action or increased authority is added.
  Source PR631 merged fe21e691c91c72db5d1d87ee097ab3fbdae9277b after corrected
  CLEAN review and full exact source CI37414479128 plus separate automatic CI.
  Native amd64/arm64 image run37415478242 and independent registry OCI,
  SLSAv1 and SPDX checks verified the same source. All twelve application pins,
  attestor digest and current rollback image use the immutable verified index.
  Schema 243 through 20261006020000, migration and fixture contracts are unchanged.
  Exact package Linux lifecycle and final package review remain required before
  publication or managed installation. Risk, credential and default-OFF boundaries
  are unchanged. OPS-010 real fresh empty-PGDATA startup remains unqualified.
