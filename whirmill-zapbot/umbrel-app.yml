dependencies: []
releaseNotes: >-
  Adds payload-free timing telemetry that separates shared-budget permit wait
  from work duration. Events contain only duration and acquisition mode.
  This diagnostic release does not establish a latency improvement or resolve
  partial Operator Posture collection. No global deadline, cache TTL, pool,
  schema, risk, or authority setting changes; no live activation.
  H4 economics stays bounded to 20 seconds and H4 CLI keeps a 30-second receive
  timeout without guaranteeing completion. OPS002 transport and OPS010
  fresh-bootstrap follow-up remain open; OPS009 still requires attribution
  and normal-browser qualification.
