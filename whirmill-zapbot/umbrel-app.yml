path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-zapbot/icon.png
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Preserves the 0.1.6 Trusted V2 activation and fixes Umbrel legacy updates by
  installing the reviewed runtime scripts before every start. Extends the
  fail-closed SECURITY DEFINER restore allowlist for the new lineage and
  execution-economics RPCs. Trading risk controls remain unchanged.
