manifestVersion: 1
id: whirmill-zapbot
category: developer
name: ZapBot
version: "0.1.10"
tagline: Resource-bounded Trusted V2 activation
description: >-
  A restart-safe ZapBot package. It restores and migrates a local PostgreSQL
  data directory, requires manage-only readiness before admission, and starts
  the public LN Markets feed plus individually fenced, least-privilege Trusted
  V2 producers plus explicit one-shot execution-economics and lineage jobs.
  Default startup remains resource-bounded and keeps execution consumers and
  new entries disabled.
developer: whirmill
