defaultPassword: ""
dependencies: []
releaseNotes: >-
  Adds fresh-database bootstrap support. Startup prepares only migration roles,
  retains administrator ownership of vector across historic replay, and creates
  schemas compatibly in the migration session. Role and schema ACL checks fail
  closed. Credential initialization precedes release-SQL export, and SQL
  consumers verify checksums; post-migration bootstrap and verification then
  require the full least-privilege contract.
