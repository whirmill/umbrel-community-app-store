defaultPassword: ""
dependencies: []
releaseNotes: >-
  Lightweight Operator Posture health omits unused learning computation.
  Command-failure enrichment selects three JSON paths while retaining its fallback.
  Lightweight health uses a separate cache key; full health keeps its key and TTL.
  No global deadline, cache TTL, pool, schema, risk, or authority setting changes;
  no live activation. H4 economics stays bounded to 20 seconds and H4 CLI keeps
  a 30-second receive timeout without guaranteeing completion. OPS002 remains
  open, OPS010 fresh-bootstrap follow-up remains open, and OPS009 performance
  awaits normal-browser qualification.
