releaseNotes: >-
  Persists parent-bound signed active-funding observations in immutable schema
  238 evidence, with a narrow database producer role and no automatic collector
  or capital admission. Funding completeness and live venue pagination remain
  unqualified; H4 and trading authority remain disabled. Existing-data updates
  preserve prior evidence. Fresh empty-PGDATA installation remains blocked by
  OPS-010.
