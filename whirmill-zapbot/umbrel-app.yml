gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Carries continuous canonical portfolio exposure, including pending commands
  and reservations, into every risk-increasing plan together with its per-lot
  requested fraction. If the canonical snapshot is unavailable, exposure is
  cleared and new risk is blocked before command persistence. Venue payloads
  remain unchanged; the reviewed 3-active/1-decision-sleeve profile, exposure
  cap 1.0, 300-sat aggregate stop-risk budget and disabled five-lot capability
  are preserved.
