releaseNotes: >-
  Adds a default-OFF LN Markets startup-reconcile path for the supported single
  long-lived Umbrel web runtime. The package resets the flag for every service,
  then enables it only in the admitted web command after runtime-env. The
  source keeps API runtime, benchmark, observation-only, repository and
  internal-consumer fences authoritative; producers and other topologies remain
  off. It does not change readiness TTLs or gates, cron cadence, risk,
  ownership, activation, entry mode, exposure, or producer admission. Source
  revision `6f6267e737307b8004cd79855365f5ba3b7e653e` and every service/attestor
  are pinned to immutable multi-architecture index
  `sha256:39fbb5914238f84fd76585f0aa51908e72f1e4a19b1aef1b106c638006ae5c56`.
  Schema 233 and the fenced 0.1.46 compatibility rollback are retained.
