releaseNotes: >-
  Coalesces concurrent cold misses for every operational cache key and collects
  signals after the bounded summary dashboard has populated their shared queue
  diagnostics. The summary still covers every graph, Oban and notification
  queue plus all four runtime SLOs, while avoiding duplicate database fan-out.
  Runtime settings, trading and risk controls, and producer admission remain
  unchanged.
