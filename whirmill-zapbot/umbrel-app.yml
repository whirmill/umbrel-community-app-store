defaultPassword: ""
dependencies: []
releaseNotes: >-
  Isolates accepted dispatcher feedback from optional analysis, creates a fresh
  ticket for every reconnect with session fencing and backoff, moves reconcile
  HTTP outside the transaction while retaining atomic writes, and propagates
  local restore failures. Adds allowlisted H4 diagnostics. H4 economics acquisition
  remains bounded to 20 seconds and H4 CLI keeps a 30-second HTTP receive
  timeout; neither guarantees completion. Schema remains 230 through
  20260910100000; manage_only, disabled H4 admission, and the verified 0.1.46
  compatibility rollback remain. OPS002 intermittent behavior and OPS004 DB15s
  are not resolved; no trading activation is performed.
