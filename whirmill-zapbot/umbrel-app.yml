releaseNotes: >-
  Corrects H4 canary diagnostics when account identity is unavailable: missing
  identity is distinguished from a confirmed mismatch. Both conditions keep
  economics unknown and block activation without fetching economic history.
  Focused tests, the full backend suite and independent review passed.
  Schema 233 is unchanged. All ZapBot services and Trusted V2 attestation use
  source revision `6e636710ffd2cf9d0c38f8786e07fe0d1ca5ab6d`
  pinned to immutable image index `sha256:9906c9e8810a1635ee10f87c48a1edac96835b036dc5781796a2fd2142671871`.
  No risk, ownership, acquisition timeout, recovery or activation change is
  included. This does not resolve transient identity acquisition or Monitor
  latency, and does not enable trading.
