releaseNotes: >-
  Batches Oban queue diagnostics from 54 database reads into two projections,
  preserving queue and worker counts, active versus inactive backlog, oldest
  timestamps, retry attempts, and latest failures. This reduces repeated scans
  of completed job history without deleting jobs. Live SQL comparison supports
  the optimization; full Monitor collection still requires normal-browser
  qualification after installation and OPS009 remains open until then.
  No global deadline, cache TTL, pool, schema, risk, or authority setting
  changes; no live activation. OPS002 transport and OPS010 fresh-bootstrap
  follow-up remain open.
