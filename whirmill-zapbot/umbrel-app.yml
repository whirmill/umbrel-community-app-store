releaseNotes: >-
  Version 0.1.81 adds separate owner-only immutable VENUE pins, profiles and
  bindings at schema 242 through 20261006010000. Original signed bytes and
  physical registration clocks remain part of retained whole-row identity.
  Source PR627 merged 257a3783e9741bb68cfe86fbe1b570a988eb5e6d after CLEAN review.
  Exact source CI37374666540 passed all three jobs after one retained hosted-runner
  acquisition failure; native amd64/arm64 image build37377964791 and independent
  registry SLSAv1/SPDX checks verified the same source. All twelve app pins,
  attestor digest and current rollback image share the verified immutable index.
  Disposable nonempty nine-row upgrade, ownerless restore and restart checks,
  plus actual old0.1.80 application boot on schema242, remain Linux gates.
  No installation, provider execution, enrollment, consumption or live authority
  is claimed. Existing risk and credential boundaries remain unchanged.
  Fresh empty-PGDATA remains blocked by OPS-010.
