releaseNotes: >-
  Monitor-stage observability release: it records fail-open, read-only stage
  attribution across 12 Monitor stages, bounded to 24/10, through sanitized
  CLI and RPC receipts. It improves attribution of intermittent cost; it does
  not claim a latency fix. Schema 233 is unchanged. All ZapBot services and
  Trusted V2 attestation use source revision `7b61a440d1848c013c299202674105b5bc2eebb0` pinned to immutable
  image index `sha256:48e79ceef7a8e4a519999ad4e879dd76d5992181848c596ec6bc0d2f69bb9691`. No timing budget, cache TTL, pool, risk,
  authority, or activation change is included. OPS009 installation and normal-
  browser qualification remain open.
