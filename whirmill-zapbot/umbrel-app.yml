releaseNotes: >-
  Adds immutable LN Markets flat-account reconciliation receipts that bind the
  signed account snapshot, raw evidence, identity, outstanding commands and
  reservations, and terminal execution-economics coverage. Receipts remain
  observation-only with authority=none and admission_eligible=false; this update
  does not activate H4 or create live trading authority. Existing-data updates
  target schema 237. Fresh empty-PGDATA installation remains blocked by OPS-010.
