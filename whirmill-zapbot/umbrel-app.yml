defaultPassword: ""
dependencies: []
releaseNotes: >-
  Starts the normal Oban operational queues for reconciliation, alerts, and
  maintenance while retaining manage-only mode, disabled live deliberation,
  disabled execution, and disabled new entries. Trading risk controls remain
  unchanged.
