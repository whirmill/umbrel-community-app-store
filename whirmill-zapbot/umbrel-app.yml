releaseNotes: >-
  Collects runtime health and LN quality within Operator Posture's remaining
  parent deadline, preserves completed sub-results when a source fails or times
  out, and omits entry-gate enrichment unused by these cards. Missing evidence
  stays explicit. No live activation occurs. Schema remains 230 through
  20260910100000; manage_only, disabled H4 admission, and verified 0.1.46
  compatibility rollback remain. OPS002 transport remains open and runtime
  performance qualification is still required.
