defaultPassword: ""
dependencies: []
releaseNotes: >-
  Adds a signed portable acquisition artifact for observed funding rows of
  trades running in a signed account snapshot, using bounded reads and a
  dedicated read-only LN Markets credential. It does not persist funding or
  complete liability reconciliation; live pagination and integral-satoshi fee
  scope remain unqualified. The artifact carries no H4 or trading authority.
  Existing-data updates keep schema 237. Fresh empty-PGDATA installation
  remains blocked by OPS-010.
