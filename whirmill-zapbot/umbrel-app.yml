manifestVersion: 1
id: whirmill-zapbot
category: developer
name: ZapBot
version: "0.1.40"
tagline: Restart-safe live trading profile
description: >-
  A restart-safe ZapBot package. It restores and migrates a local PostgreSQL
  data directory, starts the complete event-driven runtime and the public LN
  Markets feed, and includes individually fenced, least-privilege Trusted V2
  producers plus explicit one-shot execution-economics and lineage jobs.
  Startup remains resource-bounded; execution, entry mode, exposure and risk
  remain independently controlled by persisted, audited runtime settings.
developer: whirmill
website: https://github.com/whirmill/zapbot-exs
repo: https://github.com/whirmill/zapbot-exs
support: https://github.com/whirmill/zapbot-exs/issues
port: 5237
path: ""
icon: https://cdn.jsdelivr.net/gh/whirmill/umbrel-community-app-store@07fe21c2a0f478e045d14d9d2332716892d9c213/whirmill-zapbot/icon.svg
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Makes automatic learning retries reuse their exact immutable feature
  snapshot across restarts and crash windows. Frozen ineligible evidence is
  terminal instead of retrying forever; identity or material mismatches fail
  closed and appear in bounded API/RPC diagnostics, with the ineligible count
  visible in the lineage UI. Trading, sizing, exposure, leverage and risk
  controls are unchanged; the learning pipeline generates no live actions.
