releaseNotes: >-
  Keeps Trusted V2 candle diagnostics on the preceding closed boundary until the
  receipt-visibility window completes, then advances atomically. Fresh campaigns
  remain queryable through the existing runtime-authorized coverage function;
  non-candle evidence stays current and fail closed. No database migration,
  settings, risk or trading contract changes are included.
