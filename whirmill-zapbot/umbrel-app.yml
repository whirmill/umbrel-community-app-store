support: https://github.com/whirmill/zapbot-exs/issues
port: 5237
path: ""
icon: https://raw.githubusercontent.com/whirmill/umbrel-community-app-store/main/whirmill-zapbot/icon.png
gallery: []
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Hardens the isolated Trusted V2 lineage jobs by matching their single-session
  database roles with a single Ecto connection and encoding campaign UUIDs for
  raw Postgrex queries. Trading risk controls remain unchanged.
