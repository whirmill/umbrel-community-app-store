releaseNotes: >-
  Activates the five-source Trusted V2 research lineage with campaign-scoped
  readiness, sequential one-shot seal, attestation and report jobs, and an
  isolated execution-economics handoff. Adds exact database RPC authority,
  bounded FIFO timeouts and guarded recovery while keeping normal startup and
  trading risk controls unchanged.
