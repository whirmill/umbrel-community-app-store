releaseNotes: >-
  Unlocks pool-aware parallel execution across interactive and scheduled work.
  Operator Posture, dashboards, alerts, notification dispatch and retention now
  share a bounded connection budget; per-key single-flight replaces process-wide
  serialization, independent causal groups run concurrently, and same-key order
  remains preserved. Alert state and outbox admission are atomic. Runtime
  settings, trading and risk controls, and producer admission remain unchanged.
