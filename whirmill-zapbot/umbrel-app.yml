releaseNotes: >-
  Schema-234 terminal-economics package from reviewed merged source
  b9cdcd80f18203eb88703612ccd752331568d6e3. It adds an internal append-only
  terminal-realized economics receipt relation and UUID-only materializer. Every
  persisted receipt is permanently `authority=none` and `admission_eligible=false`;
  it does not wire live admission, execution, producers, scheduling, risk, entry
  mode, exposure or activation. The release SQL bootstrap/verifier proves the
  exact function, append-only triggers and least-privilege runtime ACL. Its image
  is a reviewed immutable linux/amd64+linux/arm64 index; this note makes no
  installation claim. The fenced 0.1.46 compatibility rollback remains a
  schema-234 verification path.
