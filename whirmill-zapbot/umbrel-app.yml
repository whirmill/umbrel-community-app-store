releaseNotes: >-
  Stabilizes learning-label retries and causal availability, protects
  normalization bases, validates complete aggregation windows, and corrects
  research monetary conversion, effective sample size and degradation alerts.
  Adds bounded passive execution-evidence capture and read-only diagnostics,
  disabled by default. Updates the startup SQL allowlist for the new causal
  attestation function so subsequent restarts retain the strict verifier.
  Passive capture remains off; existing entry mode, execution and risk controls
  persist across the update and restarts.
