description: >-
  A restart-safe ZapBot package. It restores and migrates a local PostgreSQL
  data directory, starts the complete event-driven runtime and the public LN
  Markets feed, and includes individually fenced, least-privilege Trusted V2
  producers plus explicit one-shot execution-economics and lineage jobs.
  Startup remains resource-bounded; execution, entry mode, exposure and risk
  remain independently controlled by persisted, audited runtime settings.
