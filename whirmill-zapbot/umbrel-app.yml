releaseNotes: >-
  Version 0.1.82 adds a separate owner-only immutable VENUE consumption table
  at schema 243 through 20261006020000. A committed consumption permanently
  burns its binding once; original signed bytes and physical clocks remain
  retained evidence. Source PR629 merged fc3f22d0acc0e18a0ce2816c51dbc79c0d3ed297
  after CLEAN review and exact source CI37394735846 passed all three jobs,
  including PG18 ten-row ownerless restore and nine-row 242 upgrade retention.
  Native amd64/arm64 build37395651977 and independent registry SLSAv1/SPDX
  checks verified that source. All twelve app pins, attestor digest and current
  rollback image share its immutable index. Actual Linux ten-row lifecycle,
  old0.1.81 application compatibility and final package review remain gates.
  No live consumer, callback, HTTP consumption, provider action, enrollment,
  current capability or increased trading authority is enabled. Existing risk
  and credential boundaries remain unchanged. Fresh empty-PGDATA remains
  blocked by OPS-010.
