releaseNotes: >-
  Corrects the database bootstrap check that prevented upgrades from the
  previous schema. Startup can provision migration access before the new
  causal-attestation function exists, then requires its exact contract after
  migration. Includes the learning stabilization and default-off passive
  evidence capability from 0.1.41. Existing entry mode, execution and risk
  controls persist across the update and restarts.
