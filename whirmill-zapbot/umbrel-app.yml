releaseNotes: >-
  Coalesces concurrent Operator Posture readers onto one short-lived,
  server-owned eleven-source collection. It retains per-key operational-cache
  single-flight, summary-first signals collection, every graph, Oban and
  notification queue, and all four runtime SLOs while preventing duplicate
  database fan-out across tabs or clients. Runtime settings, trading and risk
  controls, and producer admission remain unchanged.
