releaseNotes: >-
  Fixes read-only settlement provenance RPC under the restricted runtime
  database role. The installed 0.1.76 query failed because that role cannot
  execute public.digest; this image uses PostgreSQL's built-in SHA-256 without
  widening privileges. Exact-source CI exercises the real restricted role and
  full snapshot. No ACL, schema, policy, risk, admission or capital-authority
  change. Schema 238 and the five-consumer DNS correction remain. Fresh
  empty-PGDATA installation remains blocked by OPS-010.
