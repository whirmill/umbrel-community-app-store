releaseNotes: >-
  Adds dormant owner-only producer pins, signed governance profiles and immutable
  committed parent/profile/wire/attempt bindings at schema 240 through
  20261005010000. No provisioned production producer LOGIN, runtime receipt
  consumer, transport ordering, venue dispatch, activation, admission or risk
  authority is added. Source PR620/4d84efb2 and PostgreSQL 18 fresh/224-upgrade/
  ownerless-224-restore CI37251509725 passed. Native image37252166877 passed both
  architectures; registry index, SHA alias and OCI/build revision pins match
  source. Separate native PostgreSQL 17 synthetic nonempty selected-table restore
  passed; exact-image Linux nonempty profile/receipt retention remains
  unqualified. Exact-image Linux restore-224 lifecycle, schema-preserving rollback
  and final package review remain required before publication, merge or an
  existing-data update. No installation is claimed. Fresh empty-PGDATA
  installation remains blocked by OPS-010.
