  execution-economics-key-init:
    profiles: [execution-economics-ops]
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    restart: "no"
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/secrets/execution-coverage-acquirer:/acquirer
      - ${APP_DATA_DIR}/data/secrets/execution-economics-attestation:/attestation
      - ${APP_DATA_DIR}/data/secrets/execution-economics-producer:/producer
    depends_on:
      credential-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        acquisition_private=/acquirer/signing-private-key
        acquisition_hmac=/attestation/hmac-key
        acquisition_public=/producer/signing-public-key
        acquisition_consumed=/acquirer/consumed
        if [ -e "$$acquisition_consumed" ]; then
          test -s "$$acquisition_public" || { echo 'consumed execution-economics acquisition lacks its public key' >&2; exit 1; }
          rm -f "$$acquisition_private" "$$acquisition_hmac"
          exit 0
        fi
        existing_key_files=0
        for key_file in "$$acquisition_private" "$$acquisition_hmac" "$$acquisition_public"; do
          if [ -e "$$key_file" ]; then existing_key_files=$$((existing_key_files + 1)); fi
        done
        if [ "$$existing_key_files" -gt 0 ] && { [ ! -s "$$acquisition_private" ] || [ ! -s "$$acquisition_hmac" ] || [ ! -s "$$acquisition_public" ]; }; then
          echo 'incomplete execution-economics key material; refusing regeneration' >&2
          exit 1
        fi
        if [ "$$existing_key_files" -eq 0 ]; then
          openssl genpkey -algorithm ED25519 -out /tmp/execution-economics-signing.pem
          openssl pkey -in /tmp/execution-economics-signing.pem -outform DER | tail -c 32 | base64 | tr -d '\n' > "$$acquisition_private"
          openssl pkey -in /tmp/execution-economics-signing.pem -pubout -outform DER | tail -c 32 | base64 | tr -d '\n' > "$$acquisition_public"
          openssl rand 32 | base64 | tr -d '\n' > "$$acquisition_hmac"
          rm -f /tmp/execution-economics-signing.pem
        fi
        chmod 600 "$$acquisition_private" "$$acquisition_hmac" "$$acquisition_public"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 64m

  execution-economics-handoff-init:
    profiles: [execution-economics-ops]
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    restart: "no"
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/handoff/execution-economics:/handoff
    depends_on:
      normalize-and-verify:
        condition: service_completed_successfully
      execution-economics-key-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        if [ -e /handoff/artifact.pipe ] || [ -e /handoff/ack.pipe ]; then
          echo 'execution-economics FIFO handoff already exists; refusing concurrent or stale run' >&2
          exit 1
        fi
        mkfifo /handoff/artifact.pipe /handoff/ack.pipe
        chmod 600 /handoff/artifact.pipe /handoff/ack.pipe
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 64m

  execution-coverage-acquirer:
    profiles: [execution-economics-ops]
    image: ghcr.io/whirmill/zapbot:umbrel-zapbot-local-7a2f1f68b0e1d6b44cd800adc05991b141c95a9c@sha256:e75619f22276e37c0acf4ef8a0caa985f204923c11409ffa8ab9d0281ef30803
    restart: "no"
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/env/execution-coverage-acquirer:/service-env
      - ${APP_DATA_DIR}/data/secrets/execution-coverage-acquirer:/run/zapbot-acquisition
      - ${APP_DATA_DIR}/data/secrets/execution-economics-attestation:/run/zapbot-attestation
      - ${APP_DATA_DIR}/data/handoff/execution-economics:/handoff
    depends_on:
      execution-economics-handoff-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        test -s /service-env/config.env || { echo 'missing isolated execution-coverage configuration' >&2; exit 66; }
        test -p /handoff/artifact.pipe && test -p /handoff/ack.pipe || { echo 'execution-economics FIFO handoff is absent' >&2; exit 66; }
        baked_revision="$${ZAPBOT_BUILD_GIT_COMMIT_SHA:-}"
        set -a
        . /service-env/config.env
        set +a
        test "$${#baked_revision}" -eq 40 || { echo 'image is missing an immutable revision' >&2; exit 65; }
        export ZAPBOT_BUILD_GIT_COMMIT_SHA="$$baked_revision"
        export GIT_COMMIT_SHA="$$baked_revision"
        unset RAILWAY_GIT_COMMIT_SHA RELEASE_SYS_CONFIG DATABASE_URL MIGRATION_DATABASE_URL
        export ZAPBOT_RUNTIME_MODE=lnmarkets_execution_coverage_acquirer
        export TRUSTED_V2_EXECUTION_ECONOMICS_ACQUISITION_ENABLED=true
        export ZAPBOT_EXECUTION_COVERAGE_SIGNING_PRIVATE_KEY="$$(cat /run/zapbot-acquisition/signing-private-key)"
        export ZAPBOT_EXECUTION_ECONOMICS_ACQUISITION_HMAC_KEY="$$(cat /run/zapbot-attestation/hmac-key)"
        timeout -s TERM -k 30 1200 /bin/sh -ec 'bin/zapbot eval '\''ZapbotHub.Release.LNMarketsExecutionCoverageAcquirer.emit_handoff_from_env!(confirm: true, limit: 1000, max_pages: 64)'\'' > /handoff/artifact.pipe; IFS= read -r acknowledgement < /handoff/ack.pipe; test "$$acknowledgement" = committed'
        rm -f /run/zapbot-acquisition/signing-private-key /run/zapbot-attestation/hmac-key /service-env/config.env
        rm -f /handoff/artifact.pipe /handoff/ack.pipe
        : > /run/zapbot-acquisition/consumed
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 384m

  execution-economics-producer:
    profiles: [execution-economics-ops]
    image: ghcr.io/whirmill/zapbot:umbrel-zapbot-local-7a2f1f68b0e1d6b44cd800adc05991b141c95a9c@sha256:e75619f22276e37c0acf4ef8a0caa985f204923c11409ffa8ab9d0281ef30803
    restart: "no"
