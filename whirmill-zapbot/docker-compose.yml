      - ${APP_DATA_DIR}/data/secrets/execution-economics-producer:/run/zapbot-acquisition:ro
      - ${APP_DATA_DIR}/data/secrets/execution-economics-attestation:/run/zapbot-attestation:ro
      - ${APP_DATA_DIR}/data/handoff/execution-economics:/handoff
      - ${APP_DATA_DIR}/data/tls/ca:/run/zapbot-db-tls:ro
      - ${APP_DATA_DIR}/scripts/runtime-env.sh:/usr/local/bin/runtime-env:ro
    depends_on:
      execution-economics-handoff-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        test -p /handoff/artifact.pipe && test -p /handoff/ack.pipe || { echo 'execution-economics FIFO handoff is absent' >&2; exit 66; }
        . /usr/local/bin/runtime-env
        export POOL_SIZE=1
        export ZAPBOT_RUNTIME_MODE=lnmarkets_execution_economics_producer
        export TRUSTED_V2_EXECUTION_ECONOMICS_ENABLED=true
        export ZAPBOT_EXECUTION_ECONOMICS_ACQUISITION_PUBLIC_KEY="$$(cat /run/zapbot-acquisition/signing-public-key)"
        export ZAPBOT_EXECUTION_ECONOMICS_ACQUISITION_HMAC_KEY="$$(cat /run/zapbot-attestation/hmac-key)"
        timeout -s TERM -k 30 1200 /bin/sh -ec 'bin/zapbot eval '\''Zapbot.Release.LNMarketsExecutionEconomicsProducer.run_handoff!(confirm: true); :ok'\'' < /handoff/artifact.pipe; printf '\''committed\n'\'' > /handoff/ack.pipe'
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
